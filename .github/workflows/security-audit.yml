name: Security audit

# Runs pip-audit against requirements.txt to catch any pinned
# dependency with a known CVE. Triggers on every push to the working
# branches, every pull request, and weekly so a CVE published after a
# merge still surfaces.
on:
  push:
    branches: [main, VVCE-V1]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Mondays 06:00 UTC

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict
