    <style>
        /* Sunday — editorial cream surface, dark only inside AR practice */
        body {
            background-color: #FAF7F2;
            color: #1A1814;
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-display { font-family: 'Fraunces', ui-serif, Georgia, serif; letter-spacing: -0.02em; font-optical-sizing: auto; }
        .kicker { letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; }

        .view-fade-in { animation: viewFadeIn 0.5s cubic-bezier(0.22, 0.8, 0.3, 1) forwards; }
        @keyframes viewFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scrollable-content { overflow-y: auto; max-height: calc(100vh - 350px); scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }

        .loading-animation {
            border: 4px solid rgba(26, 24, 20, 0.08);
            border-top: 4px solid #2F4A31;
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .pressable { transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease; }
        .pressable:active { transform: translateY(1px) scale(0.99); }

        /* Editorial pose cards */
        .asana-tile {
            transition: transform 0.35s cubic-bezier(0.22, 0.8, 0.3, 1), box-shadow 0.35s ease;
            cursor: pointer;
        }
        .asana-tile:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 50px -20px rgba(26, 24, 20, 0.22);
        }

        #cursor-glow { display: none; }

        @keyframes pulse-green {
            0%   { box-shadow: 0 0 0 0 rgba(74, 127, 77, 0.55); }
            70%  { box-shadow: 0 0 0 14px rgba(74, 127, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 127, 77, 0); }
        }
        @keyframes pulse-blue {
            0%   { box-shadow: 0 0 0 0 rgba(184, 87, 62, 0.55); }
            70%  { box-shadow: 0 0 0 14px rgba(184, 87, 62, 0); }
            100% { box-shadow: 0 0 0 0 rgba(184, 87, 62, 0); }
        }
        .voice-listening { animation: pulse-green 1.5s infinite; border-color: #4A7F4D !important; }
        .voice-talking   { animation: pulse-blue 1.5s infinite;  border-color: #B8573E !important; }

        /* AR / Video feed */
        #video-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background-color: #0A100B;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 18px 40px -10px rgba(0, 0, 0, 0.45);
        }
        #video-feed { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; transform: scaleX(-1); }
        #ar-canvas  { position: absolute; top:0; left:0; width:100%; height:100%; transform: scaleX(-1); }

        /* Heatmap cell */
        .heatcell {
            width: 11px; height: 11px; border-radius: 3px;
            background: rgba(26, 24, 20, 0.06);
            transition: transform 0.15s ease;
        }
        .heatcell.lv1 { background: rgba(74, 107, 77, 0.4); }
        .heatcell.lv2 { background: rgba(74, 107, 77, 0.6); }
        .heatcell.lv3 { background: rgba(74, 107, 77, 0.8); }
        .heatcell.lv4 { background: #4A6B4D; }
        .heatcell:hover { transform: scale(1.8); }

        /* --- Premium Asana Library Styles (editorial cream) --- */
        .asana-card {
            background: #F3EEE5;
            border: 1px solid rgba(26, 24, 20, 0.04);
            transition: all 0.35s cubic-bezier(0.22, 0.8, 0.3, 1);
            color: #1A1814;
        }

        .asana-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 50px -20px rgba(26, 24, 20, 0.22);
            border-color: rgba(26, 24, 20, 0.08);
        }

        /* Modal Backdrop */
        #asana-modal-backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #asana-modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Modal Content */
        #asana-modal-content {
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #asana-modal-backdrop.active #asana-modal-content {
            transform: translateY(0) scale(1);
        }

        /* Scrollbar for modal */
        .modal-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .modal-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-scroll::-webkit-scrollbar-thumb {
            background: rgba(66, 165, 245, 0.3);
            border-radius: 10px;
        }

        /* ========================================
           MOBILE RESPONSIVENESS FIXES
           ======================================== */

        /* Base reset for all screens */
        * {
            box-sizing: border-box;
        }

        /* Mobile-first media queries */
        @media screen and (max-width: 768px) {
            body {
                font-size: 14px;
            }

            #app {
                padding: 12px !important;
            }

            header {
                flex-direction: column !important;
                gap: 16px !important;
                padding-bottom: 16px !important;
                margin-bottom: 16px !important;
            }

            header h1 {
                font-size: 2rem !important;
            }

            header .text-left p {
                font-size: 9px !important;
            }

            /* Navigation buttons */
            header .flex.items-center.space-x-3 {
                flex-wrap: wrap;
                gap: 8px !important;
            }

            header button,
            header a {
                padding: 8px 12px !important;
                font-size: 11px !important;
            }

            /* Main content area */
            main#content {
                padding: 16px !important;
                border-radius: 20px !important;
                min-height: 50vh !important;
            }

            /* Feature cards grid */
            .grid.md\\:grid-cols-2 {
                grid-template-columns: 1fr !important;
            }

            /* Bottom navigation */
            nav.fixed {
                padding-bottom: env(safe-area-inset-bottom, 8px);
            }

            #nav-tabs {
                gap: 4px !important;
            }

            #nav-tabs button {
                flex-direction: column !important;
                padding: 8px 6px !important;
                font-size: 9px !important;
                gap: 2px !important;
            }

            #nav-tabs button svg {
                width: 20px !important;
                height: 20px !important;
            }

            #nav-tabs button span {
                font-size: 9px !important;
            }

            /* Asana cards */
            .asana-card {
                padding: 12px !important;
            }

            /* Modal adjustments */
            #asana-modal-content {
                margin: 12px !important;
                max-height: 85vh !important;
            }
        }

        /* Extra small screens */
        @media screen and (max-width: 400px) {
            header h1 {
                font-size: 1.5rem !important;
            }

            header .w-12 {
                width: 40px !important;
                height: 40px !important;
            }

            header button,
            header a {
                padding: 6px 10px !important;
                font-size: 10px !important;
            }

            #nav-tabs button {
                padding: 6px 4px !important;
            }
        }
    </style>

</head>

    <script>
        // --- Firebase and Environment Setup (Required variables for Canvas runtime) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        // FIX: Corrected variable reference from __initialAuthToken to __initial_auth_token
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Mock Data ---
        const asanaData = [
            {
                name: 'Tadasana',
                sanskrit: '(Mountain Pose)',
                category: 'Beginner',
                emoji: '⛰️',
                benefits: 'Foundational standing pose that improves posture, strengthens thighs, knees, and ankles. It helps establish a sense of grounding and mental clarity.',
                precaution: 'Avoid if you have low blood pressure, insomnia, or are experiencing dizziness.',
                targeted: 'Spine, Core, Legs',
                steps: [
                    'Stand with feet together, big toes touching.',
                    'Distribute your weight evenly through both feet.',
                    'Engage your thighs and lift your kneecaps.',
                    'Lengthen your tailbone toward the floor and lift your chest.',
                    'Relax shoulders away from ears, arms by your sides.'
                ]
            },
            {
                name: 'Vrikshasana',
                sanskrit: '(Tree Pose)',
                category: 'Beginner',
                emoji: '🌳',
                benefits: 'Improves balance and focus while strengthening the legs, ankles, and spine. It opens the hips and stretches the inner thighs.',
                precaution: 'Avoid placing the foot directly on the knee joint. Use a wall for balance if needed.',
                targeted: 'Legs, Core, Hips',
                steps: [
                    'Start in Tadasana. Shift weight onto your left leg.',
                    'Place right foot on the inner left thigh or calf (never the knee).',
                    'Press your foot into the leg and the leg into the foot.',
                    'Bring hands to heart center or reach them toward the sky.',
                    'Find a steady gaze point (Drishti) to maintain balance.'
                ]
            },
            {
                name: 'Namastey',
                sanskrit: '(Anjali Mudra)',
                category: 'Beginner',
                emoji: '🙏',
                benefits: 'Centering practice that calms the mind and reduces stress. Increases flexibility in the wrists and hands.',
                precaution: 'Keep the spine tall and avoid hunching the shoulders.',
                targeted: 'Wrists, Chest, Heart',
                steps: [
                    'Bring palms together in front of the heart.',
                    'Press the bases of the palms and fingers firmly.',
                    'Keep shoulders relaxed and elbows level.',
                    'Close your eyes and focus on your breath.',
                    'Bow your head slightly toward your fingertips.'
                ]
            },
            {
                name: 'Adho Mukha Svanasana',
                sanskrit: '(Downward Dog)',
                category: 'Intermediate',
                emoji: '🐕',
                benefits: 'Deeply stretches the hamstrings, calves, and spine. Energizes the body and improves blood flow to the head.',
                precaution: 'Avoid if you have carpal tunnel syndrome or high blood pressure.',
                targeted: 'Shoulders, Back, Hamstrings',
                steps: [
                    'Start on all fours. Tuck your toes and lift your hips high.',
                    'Press your palms firmly into the mat, fingers spread.',
                    'Lengthen your spine, reaching your sit bones toward the sky.',
                    'Keep a slight bend in knees if hamstrings are tight.',
                    'Draw your belly in and hold for several deep breaths.'
                ]
            },
            {
                name: 'Virabhadrasana III',
                sanskrit: '(Warrior III)',
                category: 'Intermediate',
                emoji: '⚔️',
                benefits: 'Powerful balance pose that strengthens the back, core, and legs. Improves proprioception and stamina.',
                precaution: 'Avoid if you have lower back injuries or severe high blood pressure.',
                targeted: 'Lower Back, Hamstrings, Glutes',
                steps: [
                    'From a high lunge, lean forward over the front thigh.',
                    'Reach arms forward in line with your ears.',
                    'Lift the back leg parallel to the floor.',
                    'Flex the back foot and point toes toward the ground.',
                    'Keep your gaze down to maintain a neutral neck.'
                ]
            },
            {
                name: 'Natarajasana',
                sanskrit: '(Dance Pose)',
                category: 'Advanced',
                emoji: '💃',
                benefits: 'Deep backbend that opens the chest and shoulders while challenging balance and hip flexibility.',
                precaution: 'Ensure a proper warm-up before attempting. Use a strap if you cannot reach your foot.',
                targeted: 'Chest, Shoulders, Spine, Quads',
                steps: [
                    'Stand in Tadasana. Bend left knee and reach back for the inner ankle.',
                    'Reach the right arm forward, palm facing up.',
                    'Kick the left foot back and up away from the tailbone.',
                    'Hinge forward slightly at the hips.',
                    'Maintain a steady breath and focused gaze.'
                ]
            },
            {
                name: 'Baddha Konasana',
                sanskrit: '(Bound Angle)',
                category: 'Beginner',
                emoji: '🦋',
                benefits: 'Stretches the inner thighs, groin, and knees. Stimulates abdominal organs and improves circulation.',
                precaution: 'Use blocks under knees if they are high off the ground. Avoid if you have knee injuries.',
                targeted: 'Hips, Groin, Pelvis',
                steps: [
                    'Sit with your legs extended. Bend knees and bring soles together.',
                    'Hold your feet or ankles and draw heels closer to the pelvis.',
                    'Lengthen your spine and drop your shoulders.',
                    'Gently press knees toward the mat without using force.',
                    'Hold and breathe deeply into the hip area.'
                ]
            }
        ];

        // --- MoveNet/AR Correction Globals ---
        let videoStream = null;
        let detector = null;
        let animationFrameId = null;
        let currentPose = null; // The pose the user selects

        // --- Suggestion Stabilization Variables ---
        let suggestionBuffer = []; // Stores recent correction messages
        const BUFFER_SIZE = 5; // Number of frames to buffer before changing suggestion
        let stableSuggestion = null; // Current stable suggestion being displayed
        let correctionCounter = 0; // Frame counter for stabilization

        // --- Scoring System Variables ---
        let poseScore = 100; // Start at perfect score
        let scoreHistory = []; // Track score over time for averaging

        // --- Milestone Tracking Variables ---
        let milestonesEarned = parseInt(localStorage.getItem('milestonesEarned') || '0');
        let highAccuracyTimer = 0; // Counts frames with 70%+ accuracy
        let lastMilestoneTime = 0; // Prevents double-counting

        // Define expected body parts and confidence score threshold
        const keypointIndices = {
            'nose': 0, 'left_eye': 1, 'right_eye': 2, 'left_ear': 3, 'right_ear': 4,
            'left_shoulder': 5, 'right_shoulder': 6, 'left_elbow': 7, 'right_elbow': 8,
            'left_wrist': 9, 'right_wrist': 10, 'left_hip': 11, 'right_hip': 12,
            'left_knee': 13, 'right_knee': 14, 'left_ankle': 15, 'right_ankle': 16
        };

            async callGeminiAssistant(prompt, retries = 3) {
                // OpenRouter API key
                const OPENROUTER_API_KEY = "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";
                const API_URL = "https://openrouter.ai/api/v1/chat/completions";

                // Fallback responses for common yoga questions when API is unavailable
                const fallbackResponses = {
                    'tadasana': 'Tadasana (Mountain Pose) is a foundational standing pose that improves posture and balance. Stand with feet together, arms at sides, and focus on grounding through your feet.',
                    'downward': 'Adho Mukha Svanasana (Downward Dog) stretches the hamstrings, calves, and spine. Start on hands and knees, then lift hips up and back.',

                    'breathing': 'Pranayama (breathing exercises) are essential in yoga. Try Ujjayi breath: inhale and exhale through your nose with a slight constriction in the throat.',

                    'stress': 'For stress relief, try Child\'s Pose, Legs Up the Wall, and slow deep breathing. Hold each pose for 1-2 minutes.',
                    'default': 'I\'m here to help with your yoga practice! Try asking about specific poses like Tadasana or Downward Dog, or about breathing techniques and meditation.'
                };

                // Check for fallback match
                const getFallback = (text) => {
                    const lowerPrompt = text.toLowerCase();
                    for (const [key, response] of Object.entries(fallbackResponses)) {
                        if (lowerPrompt.includes(key)) return response;
                    }
                    return fallbackResponses.default;
                };

                for (let i = 0; i < retries; i++) {
                    try {
                        console.log(`[SUNDAY API] Attempt ${i + 1}/${retries} - Sending request...`);

                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                                'HTTP-Referer': window.location.origin,
                                'X-Title': 'SUNDAY Yoga Assistant'
                            },
                            body: JSON.stringify({
                                model: OPENROUTER_MODEL,
                                messages: [
                                    { role: "system", content: VIRTUAL_ASSISTANT_SYSTEM_PROMPT },
                                    { role: "user", content: prompt }
                                ],
                                max_tokens: 200,

                        console.log(`[SUNDAY API] Response status: ${response.status}`);

                        if (!response.ok) {
                            const errorBody = await response.text();
                            console.error(`[SUNDAY API] Error response: ${errorBody}`);

                            // Handle specific error codes
                            if (response.status === 401) {
                                console.error('[SUNDAY API] API key invalid or expired');
                                return { text: getFallback(prompt) + " (Note: Live AI is temporarily unavailable)" };
                            }
                            if (response.status === 429) {
                                console.error('[SUNDAY API] Rate limit exceeded');
                                if (i === retries - 1) {
                                    return { text: getFallback(prompt) + " (Note: AI is busy, using cached response)" };
                                }
                                await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                                continue;
                            }
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const result = await response.json();
                        console.log('[SUNDAY API] Success:', result);
                        const text = result.choices?.[0]?.message?.content || getFallback(prompt);
                        return { text };

                    } catch (error) {
                        console.error(`[SUNDAY API] Attempt ${i + 1} failed:`, error.message);

                        if (i === retries - 1) {
                            console.warn('[SUNDAY API] All retries failed, using fallback response');
                            return { text: getFallback(prompt) };
                        }
                        await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                    }

            setupVoiceCommands() {

                this.recognitionInstance.onresult = async (event) => {
                    const last = event.results.length - 1;
                    const transcript = event.results[last][0].transcript.toLowerCase().trim();
                    console.log('Voice Command Received:', transcript);

                    // Acknowledge the command via UI/Console
                    updateMicStatus(true, `Heard: "${transcript}"`);

                    // === COMMAND HANDLING ===
                    let commandExecuted = false;

                    // Navigation commands
                    const navigationMap = {
                        'home': 'dashboard',
                        'dashboard': 'dashboard',
                        'pose library': 'asana',
                        'library': 'asana',

                    // Profile command
                    if (transcript.includes('profile') || transcript.includes('my profile') || transcript.includes('show profile')) {
                        window.location.href = '/profile';
                        this.speakCorrection('Opening your profile.', true);
                        updateMicStatus(true, 'Done');
                        commandExecuted = true;

                    }

                    // Logout command
                    if (transcript.includes('logout') || transcript.includes('log out') || transcript.includes('sign out') || transcript.includes('signout')) {
                        this.speakCorrection('Logging you out. Goodbye!', true);
                        updateMicStatus(true, 'Done');
                        setTimeout(() => { window.location.href = '/logout'; }, 1500);
                        commandExecuted = true;
                        return;
                    }

                    // Voice off command
                    if (transcript.includes('stop listening') || transcript.includes('voice off') || transcript.includes('turn off') ||
                        transcript.includes('mute') || transcript.includes('silence') || transcript.includes('shut up')) {
                        this.isListening = false;
                        this.recognitionInstance.stop();
                        this.speakCorrection('Voice assistant turned off. Click the mic button to turn me back on.', true);
                        updateMicStatus(false, 'Done');
                        commandExecuted = true;
                        return;
                    }

                    // Pose-specific AR correction commands (detects pose names and starts AR session)
                    const poseKeywords = {
                        'tadasana': 'Tadasana (Mountain Pose)',
                        'mountain pose': 'Tadasana (Mountain Pose)',

                        if (transcript.includes(keyword) && (transcript.includes('start') || transcript.includes('practice') ||

                            this.navigate('ar_correction');

                            updateMicStatus(true, 'Done');
                            commandExecuted = true;
                            return;

                    }

                    // Standard navigation
                    for (const phrase in navigationMap) {
                        if (transcript.includes(phrase)) {
                            const targetView = navigationMap[phrase];
                            this.navigate(targetView);
                            this.speakCorrection(`Done. Navigated to ${targetView.replace('_', ' ')}.`, true);
                            updateMicStatus(true, 'Done');

                    // If no command recognized, try AI assistant or say "no command"
                    if (!commandExecuted) {
                        // Check if it's a question (contains question words)
                        const isQuestion = transcript.includes('what') || transcript.includes('how') || transcript.includes('why') ||
                            transcript.includes('when') || transcript.includes('where') || transcript.includes('who') ||
                            transcript.includes('tell me') || transcript.includes('explain') || transcript.includes('?');

                        if (isQuestion || transcript.length > 15) {

                        updateMicStatus(true);

                this.recognitionInstance.onend = () => {

                        setTimeout(() => {

                            } catch (e) {

                                updateMicStatus(false);
                            }
                        }, 500); // Increased delay to 500ms for better stability
                    } else {
                        // If listening was manually turned off/navigation occurred, confirm status is 'Voice Off'
                        updateMicStatus(false);
                    }
                };

                gradient.addColorStop(1, '#1E1E1E');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#42A5F5';
                ctx.lineWidth = 10;
                ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

                ctx.lineWidth = 3;

                // Title
                ctx.fillStyle = '#42A5F5';
                ctx.font = 'bold 72px Inter, sans-serif';
                ctx.textAlign = 'center';

                // Subtitle
                ctx.fillStyle = '#FFEB3B';
                ctx.font = '32px Inter, sans-serif';
                ctx.fillText('SUNDAY Yoga & Wellness Platform', canvas.width / 2, 240);

                // Body text
                ctx.fillStyle = '#E0E0E0';
                ctx.font = '28px Inter, sans-serif';
                ctx.fillText('This certifies that', canvas.width / 2, 340);

                // User name (you can customize this)
                ctx.fillStyle = '#FFEB3B';
                ctx.font = 'bold 48px Inter, sans-serif';
                ctx.fillText('Yoga Practitioner', canvas.width / 2, 420);

                ctx.fillText('for 20 seconds during practice sessions', canvas.width / 2, 610);

                // Date
                const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                ctx.fillStyle = '#42A5F5';
                ctx.font = '24px Inter, sans-serif';
                ctx.fillText(`Awarded on ${today}`, canvas.width / 2, 720);

                // Signature line
                ctx.strokeStyle = '#42A5F5';

            speakCorrection(message, force = false) {
                // Check if browser supports speech synthesis
                if (!('speechSynthesis' in window)) {
                    console.warn('Text-to-Speech not supported in this browser');
                    return;
                }

                // If force is false, don't interrupt if already speaking
                if (!force && (this.isSpeaking || window.speechSynthesis.speaking)) {
                    return;
                }

                // Cancel any pending speech if forcing
                if (force) {
                    window.speechSynthesis.cancel();
                }


                // Create utterance
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.rate = 0.9; // Slightly slower for clarity
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                utterance.lang = 'en-US';

                // Event handlers
                utterance.onstart = () => {
                    this.isSpeaking = true;
                };

                utterance.onend = () => {
                    this.isSpeaking = false;
                };

                utterance.onerror = (event) => {
                    console.error('TTS Error:', event);
                    this.isSpeaking = false;
                };

                // Speak
                window.speechSynthesis.speak(utterance);
            },
