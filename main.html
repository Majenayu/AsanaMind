                            <p class="kicker text-[10px] md:text-[11px] text-saffron-500">A QUIET REMINDER</p>
                            <p class="font-display text-[26px] md:text-[34px] leading-[1.25] text-cream mt-4">
                                "Consistency is louder than intensity."

                            <div class="mt-6">

                            </div>
                        </div>
                    </section>

            renderAsanaLibrary() {
                // Editorial pose grid

                    { bg: '#B8573E', fg: '#FAF7F2', accent: '#F2D9CE' }, // terracotta
                    { bg: '#E8DFCF', fg: '#1A1814', accent: '#B8573E' }, // sand
                    { bg: '#2F4A31', fg: '#FAF7F2', accent: '#D4A04A' }, // forest 700
                    { bg: '#D4A04A', fg: '#1A1814', accent: '#1E2E1F' }, // saffron
                    { bg: '#3D3A33', fg: '#FAF7F2', accent: '#E6C489' }, // ink 700
                    { bg: '#F3EEE5', fg: '#1A1814', accent: '#4A6B4D' }, // paper
                    { bg: '#D9CFBB', fg: '#1A1814', accent: '#B8573E' }, // stone
                    { bg: '#D4866F', fg: '#FAF7F2', accent: '#FAF7F2' }, // terracotta 400

                        ${['All', 'Beginner', 'Intermediate', 'Advanced', 'Foundation', 'Balance', 'Flexibility'].map((f, i) => `
                            <button class="px-4 py-2 rounded-full text-[12px] md:text-[13px] font-medium transition ${i===0 ? 'bg-forest-900 text-cream' : 'bg-cream text-ink-700 border border-stone hover:bg-paper'}">${f}</button>

                    <!-- Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-5">
                        ${asanaData.map((asana, i) => {
                            const p = palettes[i % palettes.length];
                            const darkBg = ['#1E2E1F','#B8573E','#2F4A31','#3D3A33','#D4866F'].includes(p.bg);
                            return `
                                <div onclick="app.showAsanaDetails('${asana.name}')"
                                     class="asana-tile relative rounded-[18px] md:rounded-[24px] overflow-hidden aspect-[4/5] md:aspect-[4/3.2] p-4 md:p-6 flex flex-col justify-between"
                                     style="background:${p.bg}; color:${p.fg};">
                                    <div class="flex items-start justify-between">
                                        <span class="kicker text-[9px] md:text-[10px] px-2 py-1 rounded-full border" style="border-color:${p.fg}; opacity:0.85;">${asana.category.toUpperCase()}</span>
                                        <span class="font-display text-[22px] md:text-[26px] font-light opacity-80" style="color:${p.fg};">→</span>
                                    </div>
                                    <div class="flex-1 flex items-center justify-center">
                                        <span class="font-display text-[72px] md:text-[110px] font-light leading-none" style="color:${p.fg};">${asana.emoji || '🧘'}</span>
                                    </div>
                                    <div>
                                        <p class="kicker text-[9px] md:text-[10px] opacity-80 mb-1" style="color:${p.fg};">${asana.sanskrit.toUpperCase()}</p>
                                        <h3 class="font-display text-[18px] md:text-[26px] leading-tight" style="color:${p.fg};">${asana.name}</h3>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            },

            showAsanaDetails(asanaName) {
                const asana = asanaData.find(a => a.name === asanaName);
                if (!asana) return;

                const backdrop = document.getElementById('asana-modal-backdrop');
                const name = document.getElementById('modal-asana-name');
                const sanskrit = document.getElementById('modal-asana-sanskrit');
                const benefits = document.getElementById('modal-asana-benefits');
                const precaution = document.getElementById('modal-asana-precaution');
                const steps = document.getElementById('modal-asana-steps');
                const category = document.getElementById('modal-asana-category');
                const targeted = document.getElementById('modal-asana-targeted');
                const startBtn = document.getElementById('modal-start-btn');

                name.textContent = asana.name;
                sanskrit.textContent = asana.sanskrit;
                benefits.textContent = asana.benefits;
                precaution.textContent = asana.precaution;
                category.textContent = asana.category;
                targeted.textContent = asana.targeted;

                category.className = `inline-flex px-3 py-1 text-[11px] rounded-full font-semibold ${asana.category === 'Beginner' ? 'bg-forest-900 text-cream' : asana.category === 'Intermediate' ? 'bg-terracotta-600 text-cream' : 'bg-ink-900 text-saffron-500'}`;

                // Update kicker category label
                const kicker = document.getElementById('modal-asana-category-kicker');
                if (kicker) kicker.textContent = asana.category;

                steps.innerHTML = asana.steps.map((step, idx) => `
                    <li class="flex items-start gap-3">
                        <span class="w-7 h-7 rounded-lg bg-paper border border-stone flex items-center justify-center text-[11px] font-semibold text-terracotta-600 shrink-0">

                    </li>
                `).join('');

                startBtn.onclick = () => {
                    this.closeAsanaDetails();
                    this.selectAsanaAndStart(asana.name);
                };

                backdrop.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent scroll

                const backdrop = document.getElementById('asana-modal-backdrop');

                                <span class="font-display text-[56px] md:text-[80px] leading-none text-forest-100 my-3">${asana.emoji || '🧘'}</span>

                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            },


            renderCourse() {
                const completedCount = this.courseProgress.poses.filter(p => p.completed).length;
                const totalPoses = this.courseProgress.poses.length;
                const progressPercent = (completedCount / totalPoses) * 100;

                return `
                <div id="course-container" class="space-y-8">
                    <header class="max-w-3xl">
                        <p class="kicker text-[10px] md:text-[11px] text-terracotta-600 mb-3">The Course</p>
                        <h1 class="font-display font-light text-[40px] md:text-[64px] lg:text-[76px] leading-[1.02] tracking-tight text-ink-900">
                            Practice, tested.
                        </h1>
                        <p class="text-[15px] md:text-[17px] text-ink-500 mt-5 max-w-xl leading-[1.7]">Hold each asana at 90% accuracy for ten continuous seconds. Three attempts per pose. Complete all seven to earn your certificate.</p>
                    </header>

                    <!-- Progress card -->
                    <div class="rounded-[22px] md:rounded-[28px] bg-forest-900 text-cream p-6 md:p-8 space-y-5">
                        <div class="flex items-end justify-between gap-4">
                            <div>
                                <p class="kicker text-[10px] md:text-[11px] text-saffron-500">PROGRESS</p>
                                <p class="font-display text-[32px] md:text-[44px] font-light mt-1">${completedCount} of ${totalPoses}</p>
                            </div>
                            <p class="kicker text-[11px] text-forest-300">${Math.round(progressPercent)}% COMPLETE</p>
                        </div>
                        <div class="w-full bg-forest-700 rounded-full h-2 overflow-hidden">
                            <div class="h-full bg-saffron-500 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>

                    <!-- Pose list -->
                    <div class="space-y-3 md:space-y-4">
                        ${this.courseProgress.poses.map((pose, idx) => {
                            const a = asanaData.find(x => x.name === pose.name);
                            let rightLabel = '';
                            let bg = 'bg-paper';
                            let accent = 'text-ink-900';
                            if (pose.completed) { rightLabel = 'COMPLETED'; bg = 'bg-forest-900 text-cream'; accent = 'text-saffron-500'; }
                            else if (pose.locked) { rightLabel = 'LOCKED'; bg = 'bg-sand'; accent = 'text-ink-500'; }
                            else { rightLabel = `${pose.attemptsRemaining}/3 ATTEMPTS`; }
                            const isDark = pose.completed;
                            const textColor = isDark ? '#FAF7F2' : '#1A1814';
                            const subColor = isDark ? '#8BA88D' : '#6B6657';
                            return `
                            <div class="rounded-[18px] md:rounded-[22px] ${bg} p-5 md:p-6 flex flex-col md:flex-row md:items-center gap-4 md:gap-6">
                                <div class="flex items-center gap-4 md:gap-5 flex-1 min-w-0">
                                    <span class="font-display text-[40px] md:text-[56px] font-light leading-none shrink-0" style="color:${textColor}; opacity:${pose.locked ? 0.35 : 1};">${String(idx+1).padStart(2,'0')}</span>
                                    <div class="min-w-0">
                                        <p class="kicker text-[10px] mb-1" style="color:${pose.locked ? '#A8A294' : (pose.completed ? '#D4A04A' : '#B8573E')};">${(a?.sanskrit || pose.name).toUpperCase()}</p>
                                        <h4 class="font-display text-[20px] md:text-[26px] leading-tight truncate" style="color:${textColor}; opacity:${pose.locked ? 0.45 : 1};">${pose.name}</h4>
                                        ${pose.bestAccuracy > 0 ? `
                                            <p class="text-[12px] md:text-[13px] mt-1.5" style="color:${subColor};">Best ${Math.round(pose.bestAccuracy)}% · held ${pose.timeHeld}s</p>
                                        ` : ''}
                                    </div>
                                </div>
                                <div class="flex items-center gap-3 md:gap-4 md:ml-auto shrink-0">
                                    <span class="kicker text-[10px]" style="color:${pose.locked ? '#A8A294' : (pose.completed ? '#8BA88D' : '#6B6657')};">${rightLabel}</span>
                                    ${!pose.locked && !pose.completed ? `
                                        <button onclick="app.startCourseTest('${pose.name}')"
                                                class="pressable px-5 py-3 rounded-full font-semibold text-[13px] transition ${pose.attemptsRemaining > 0 ? 'bg-terracotta-600 text-cream hover:bg-terracotta-400' : 'bg-sand text-ink-300 cursor-not-allowed'}"
                                                ${pose.attemptsRemaining > 0 ? '' : 'disabled'}>
                                            ${pose.attemptsRemaining > 0 ? 'Start test' : 'No attempts'}
                                        </button>
                                    ` : ''}
                                    ${pose.locked ? `<span class="font-display text-[20px] opacity-40">🔒</span>` : ''}
                                    ${pose.completed ? `<span class="font-display text-[20px] text-saffron-500">★</span>` : ''}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>

                    ${this.courseProgress.certificateEarned ? `
                        <div class="rounded-[22px] md:rounded-[28px] bg-terracotta-600 text-cream p-6 md:p-10 text-center space-y-4">
                            <p class="kicker text-[10px] text-terracotta-100">CONGRATULATIONS</p>
                            <h3 class="font-display font-light text-[36px] md:text-[52px] leading-[1.1]">All seven poses, well held.</h3>
                            <p class="text-[15px] md:text-[16px] text-terracotta-100 max-w-md mx-auto leading-[1.7]">You've earned your Sunday certificate of practice. Download it anytime.</p>
                            <button onclick="app.downloadCertificate()" class="pressable inline-flex items-center gap-2 px-6 py-3.5 bg-cream text-ink-900 font-semibold rounded-full hover:bg-paper">
                                Download certificate →
                            </button>
                        </div>
                    ` : ''}

                    <!-- Protocols -->
                    <div class="rounded-[22px] md:rounded-[28px] bg-paper p-6 md:p-8">
                        <p class="kicker text-[10px] md:text-[11px] text-terracotta-600 mb-3">Test protocols</p>
                        <h3 class="font-display text-[22px] md:text-[28px] text-ink-900 mb-5">Quiet, strict, fair.</h3>
                        <ul class="space-y-3 text-[14px] md:text-[15px] text-ink-700 leading-[1.6]">
                            <li class="flex items-start gap-3"><span class="kicker text-[11px] text-terracotta-600 shrink-0 w-8">01</span><span>Test starts only after a 90% posture match is detected.</span></li>
                            <li class="flex items-start gap-3"><span class="kicker text-[11px] text-terracotta-600 shrink-0 w-8">02</span><span>You have sixty seconds total to complete the hold.</span></li>
                            <li class="flex items-start gap-3"><span class="kicker text-[11px] text-terracotta-600 shrink-0 w-8">03</span><span>Must hold for ten continuous seconds at 90%+ accuracy. Any drop resets the timer.</span></li>
                            <li class="flex items-start gap-3"><span class="kicker text-[11px] text-terracotta-600 shrink-0 w-8">04</span><span>No assistance in test mode. Reference images and voice guide are disabled.</span></li>
                            <li class="flex items-start gap-3"><span class="kicker text-[11px] text-terracotta-600 shrink-0 w-8">05</span><span>Three attempts per pose. Use them wisely.</span></li>
                        </ul>
                    </div>
                </div>`;
            },

            startCourseTest(poseName) {
                const poseProgress = this.courseProgress.poses.find(p => p.name === poseName);
                if (!poseProgress || poseProgress.attemptsRemaining <= 0) {
                    alert("No attempts remaining for this pose.");
                    return;
                }

                // Request fullscreen for focus
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn(`Error attempting to enable full-screen mode: ${err.message}`);
                    });
                }

                this.courseMode = true;
                this.testActive = false; // Phase 1: Waiting for initial match
                this.currentPose = poseName;
                this.courseTimer = 0;
                this.courseHoldTime = 0;
                this.courseStartTime = Date.now();

                this.ttsEnabled = false;

                this.navigate('ar_correction');

                setTimeout(() => {
                    this.startARAssessment();

                    this.courseTimerInterval = setInterval(() => {
                        if (!this.testActive) return; // Don't start 60s timer until test is active

                        this.courseTimer++;
                        const timeLeft = 60 - this.courseTimer;

                        const timerEl = document.getElementById('course-timer-display');
                        if (timerEl) {
                            timerEl.textContent = `Time Left: ${timeLeft}s`;
                        }

                        if (this.courseTimer >= 60) {
                            this.endCourseTest(false, 'Time limit of 60s exceeded');
                        }
                    }, 1000);

                    const feedbackText = document.getElementById('current-feedback-text');
                    if (feedbackText) {
                        feedbackText.textContent = `WAITING FOR INITIAL MATCH: Match ${poseName} at 90% accuracy to start the 60s test timer.`;
                    }
                }, 500);
            },

            checkCourseProgress(currentScore) {
                if (!this.courseMode) return;

                const feedbackText = document.getElementById('current-feedback-text');
                const holdEl = document.getElementById('course-hold-display');

                // PHASE 1: Waiting for initial match
                if (!this.testActive) {
                    if (currentScore >= 90) {
                        this.testActive = true;
                        this.courseTimer = 0; // Reset timer to 0 for the 60s test
                        if (feedbackText) feedbackText.textContent = "TEST STARTED! Hold for 10s. Do not drop below 90%!";
                        if (feedbackText) feedbackText.classList.replace('text-gray-400', 'text-primary');
                    }
                    return;
                }

                // PHASE 2: Test is active, 60s timer is running
                if (currentScore >= 90) {
                    if (!this.courseHoldTimer) {
                        this.courseHoldTimer = Date.now();
                    }

                    const holdDuration = (Date.now() - this.courseHoldTimer) / 1000;

                    if (holdEl) {
                        holdEl.textContent = `${Math.floor(holdDuration)}s / 10s`;
                    }

                    if (holdDuration >= 10) {
                        this.endCourseTest(true, 'Pose Mastered! High Accuracy held for 10s.');
                    }
                } else {
                    // STRICTURE: Any drop below 90% resets the 10s hold timer immediately
                    this.courseHoldTimer = null;
                    if (holdEl) {
                        holdEl.textContent = '0s / 10s';
                    }
                    if (feedbackText && this.testActive) {
                        feedbackText.textContent = "ACCURACY DROPPED! Hold progress reset. Get back above 90%!";
                    }
                }
            },

            endCourseTest(success, message) {
                if (this.courseTimerInterval) {
                    clearInterval(this.courseTimerInterval);
                    this.courseTimerInterval = null;
                }

                // Exit fullscreen
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => console.warn(err));
                }

                const poseProgress = this.courseProgress.poses.find(p => p.name === this.currentPose);

                if (!success && this.courseMode && poseProgress) {
                    poseProgress.attemptsRemaining--;
                    localStorage.setItem('courseProgress', JSON.stringify(this.courseProgress));
                }

                this.courseMode = false;
                this.testActive = false;
                this.courseHoldTimer = null;

                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }

                if (this.videoStream) {
                    this.videoStream.getTracks().forEach(track => track.stop());
                }

                if (success) {
                    // EXISTING LOCAL UPDATE
                    const poseIdx = this.courseProgress.poses.findIndex(p => p.name === this.currentPose);
                    if (poseIdx !== -1) {
                        this.courseProgress.poses[poseIdx].completed = true;
                        this.courseProgress.poses[poseIdx].timeHeld = Math.max(this.courseProgress.poses[poseIdx].timeHeld, 10);
                        this.courseProgress.poses[poseIdx].bestAccuracy = Math.max(this.courseProgress.poses[poseIdx].bestAccuracy, poseScore);  // Assume poseScore is in scope or pass it

                        if (poseIdx + 1 < this.courseProgress.poses.length) {
                            this.courseProgress.poses[poseIdx + 1].locked = false;
                        }

                        const allCompleted = this.courseProgress.poses.every(p => p.completed);
                        if (allCompleted) {
                            this.courseProgress.certificateEarned = true;
                        }

                        localStorage.setItem('courseProgress', JSON.stringify(this.courseProgress));
                    }

                    // NEW: Sync to Backend (use this.currentPose, estimate accuracy/time)
                    fetch('/api/complete_pose', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            pose_name: this.currentPose,  // e.g., 'Tadasana'
                            accuracy: 95,  // Or use actual from detection (e.g., currentScore)
                            time_held: 10  // Min successful hold
                        })
                    }).then(res => res.json()).then(data => {
                        console.log('DB Update:', data);  // DEBUG: Check Network tab
                        if (data.success) {
                            alert(`${data.message} Logged to profile!`);  // Optional feedback
                        } else {
                            console.error('DB sync failed:', data);
                        }
                    }).catch(err => console.error('API error:', err));
                }

                alert(message);
                this.navigate('course');
            },

            // --- Initialization ---
            async init() {
                console.log("SUNDAY App Initializing...");

                if (!this.currentView) this.currentView = 'dashboard';

                // Fetch user data for dashboard personalization
                try {
                    const res = await fetch('/api/profile', { credentials: 'same-origin' });
                    if (res.ok) {
                        this.userData = await res.json();
                        window.__user_name = this.userData.name || '';
                        // Update avatar initial
                        const av = document.getElementById('avatar-btn');
                        if (av && this.userData.name) av.textContent = (this.userData.name || 'A').trim().charAt(0).toUpperCase();
                    }
                } catch (e) {
                    console.warn('profile fetch failed', e);
                }

                this.renderNav();
                this.renderContent();
                this.setupVoiceCommands();

                setTimeout(() => this.updateMilestoneUI(), 100);
            },

            // --- Assistant View ---
            renderAssistant() {
                return `
                <div class="max-w-3xl mx-auto space-y-5 h-[70vh] flex flex-col">
                    <header class="mb-2">
                        <p class="kicker text-[10px] md:text-[11px] text-terracotta-600">Sunday assistant</p>
                        <h1 class="font-display font-light text-[32px] md:text-[44px] leading-tight text-ink-900 mt-2">Ask anything.</h1>
                    </header>
                    <div class="flex-1 bg-paper rounded-[20px] p-4 md:p-5 overflow-y-auto border border-stone space-y-4" id="chat-history">
                        <div class="flex items-start gap-3">
                            <div class="w-9 h-9 rounded-full bg-forest-900 flex items-center justify-center p-1.5 shrink-0">
                                <img src="/assets/logo.png" class="w-full h-full object-contain">
                            </div>
                            <div class="bg-cream border border-stone rounded-2xl rounded-tl-none px-4 py-3 max-w-[80%]">
                                <p class="text-[14px] text-ink-700 leading-[1.65]">Namaste. I'm Sunday. How can I help with your practice today?</p>
                            </div>
                        </div>
                    </div>
                    <div class="relative">
                        <input type="text" id="chat-input" placeholder="Ask about poses, routines, or wellness..."
                            class="w-full bg-cream border border-stone text-ink-900 placeholder-ink-300 rounded-full px-5 py-4 pr-14 focus:outline-none focus:border-forest-700 transition-colors"
                            onkeypress="if(event.key === 'Enter') app.handleChatSubmit()">
                        <button onclick="app.handleChatSubmit()" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-forest-900 text-cream rounded-full hover:bg-forest-700 transition-colors flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                                <path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z" />
                            </svg>
                        </button>
                    </div>
                </div>`;
            },

            async handleChatSubmit() {
                const input = document.getElementById('chat-input');
                const history = document.getElementById('chat-history');
                const text = input.value.trim();

                if (!text) return;

                // User Message
                history.innerHTML += `
                    <div class="flex items-start space-x-3 justify-end view-fade-in">
                        <div class="bg-primary/20 rounded-2xl rounded-tr-none p-3 max-w-[80%] border border-primary/20">
                            <p class="text-sm text-white">${text}</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-gray-400">
                                <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                `;

                input.value = '';
                history.scrollTop = history.scrollHeight;

                // AI Loading State
                const loadingId = 'loading-' + Date.now();
                history.innerHTML += `
                    <div id="${loadingId}" class="flex items-start space-x-3 view-fade-in">
                        <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center p-1">
                            <img src="/assets/logo.png" class="w-full h-full object-contain">
                        </div>
                        <div class="bg-gray-800 rounded-2xl rounded-tl-none p-3">
                            <div class="flex space-x-1">
                                <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                                <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                                <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                            </div>
                        </div>
                    </div>
                `;
                history.scrollTop = history.scrollHeight;

                try {
                    const response = await this.callGeminiAssistant(text);
                    const loadingEl = document.getElementById(loadingId);
                    if (loadingEl) loadingEl.remove();

                    history.innerHTML += `
                        <div class="flex items-start space-x-3 view-fade-in">
                            <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center p-1">
                                <img src="/assets/logo.png" class="w-full h-full object-contain">
                            </div>
                            <div class="bg-gray-800 rounded-2xl rounded-tl-none p-3 max-w-[80%] border border-white/5">
                                <p class="text-sm text-gray-300 leading-relaxed">${response.text}</p>
                            </div>
                        </div>
                    `;

                    if (this.ttsEnabled) {
                        this.speakCorrection(response.text);
                    }
                } catch (e) {
                    console.error(e);
                }

                history.scrollTop = history.scrollHeight;
            },

            downloadCertificate() {
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = 600;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#1E1E1E';
                ctx.fillRect(0, 0, 800, 600);

                ctx.strokeStyle = '#42A5F5';
                ctx.lineWidth = 10;
                ctx.strokeRect(20, 20, 760, 560);

                ctx.fillStyle = '#42A5F5';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SUNDAY Yoga Certification', 400, 100);

                ctx.fillStyle = '#E0E0E0';
                ctx.font = '24px Arial';
                ctx.fillText('This certifies that', 400, 200);

                ctx.font = 'bold 36px Arial';
                ctx.fillText('Yoga Student', 400, 260);

                ctx.font = '24px Arial';
                ctx.fillText('has successfully completed the', 400, 320);
                ctx.fillText('SUNDAY Yoga Course', 400, 360);

                ctx.font = '18px Arial';
                ctx.fillStyle = '#9CA3AF';
                const today = new Date().toLocaleDateString();
                ctx.fillText(`Issued on: ${today}`, 400, 450);

                ctx.fillStyle = '#FFEB3B';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Poses Completed:', 400, 510);
                ctx.fillText('Tadasana • Namastey • Vrikshasana', 400, 545);

                const link = document.createElement('a');
                link.download = 'SUNDAY_Yoga_Certificate.png';
                link.href = canvas.toDataURL();
                link.click();
            },
        };

        // --- Initialization on Window Load ---
        // --- Initialization on Window Load ---
        window.onload = function () {
            // Locate essential elements
            app.contentEl = document.getElementById('content');
            app.navTabsEl = document.getElementById('nav-tabs');

            // Initialize App
            app.init();

            // Hide Premium Loader after a short delay to ensure assets are ready
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 800);
                }
            }, 1500);

            // Cursor Glow Effect Logic
            const glow = document.getElementById('cursor-glow');
            document.addEventListener('mousemove', (e) => {
                glow.style.left = `${e.clientX}px`;
                glow.style.top = `${e.clientY}px`;
            });
        };



    </script>
