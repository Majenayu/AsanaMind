                    document.getElementById('reference-pose-name').textContent = `${asana.name} ${asana.sanskrit}`;
                    document.getElementById('reference-targeted').textContent = asana.targeted;
                    document.getElementById('reference-benefits').textContent = asana.benefits;
                    document.getElementById('reference-precaution').textContent = asana.precaution;
                }

                // Load reference image if available
                this.loadReferenceImage(poseName);

                // Reset scoring system
                poseScore = 100;
                scoreHistory = [];
                this.updateScore(100);

                // Reset suggestion stabilization
                suggestionBuffer = [];
                stableSuggestion = null;
                correctionCounter = 0;

                // Initialize correction log
                const correctionLog = document.getElementById('correction-log');
                if (correctionLog) {
                    correctionLog.innerHTML = '<p class="text-xs text-gray-500 font-semibold mb-2">Correction Log & Suggestions:</p>';
                    this.correctionHistory = [];
                }

                this.startARAssessment();
            },

            /**
             * Loads reference image for the selected pose
             */
            loadReferenceImage(poseName) {
                const imageElement = document.getElementById('reference-image');
                const placeholder = document.getElementById('reference-placeholder');

                // Map pose names to reference images
                const imageMap = {
                    'Tadasana': 'assets/poses/tadasana.jpg',
                    'Vrikshasana': 'assets/poses/vrikshasana.jpg',
                    'Namastey': 'assets/poses/namaste.png'
                };

                const imagePath = imageMap[poseName];

                if (imagePath && imageElement) {
                    imageElement.src = imagePath;
                    imageElement.classList.remove('hidden');
                    if (placeholder) placeholder.classList.add('hidden');
                } else {
                    if (imageElement) imageElement.classList.add('hidden');
                    if (placeholder) placeholder.classList.remove('hidden');
                }
            },

            /**
             * Updates the pose score display
             */
            updateScore(score) {
                const scoreElement = document.getElementById('pose-score');
                const scoreBar = document.getElementById('score-bar');

                if (scoreElement && scoreBar) {
                    scoreElement.textContent = Math.round(score);
                    scoreBar.style.width = `${Math.max(0, Math.min(100, score))}%`;

                    // Change color based on score
                    if (score >= 85) {
                        scoreBar.className = 'bg-gradient-to-r from-green-500 to-green-400 h-3 rounded-full transition-all duration-500';
                    } else if (score >= 70) {
                        scoreBar.className = 'bg-gradient-to-r from-primary to-accent h-3 rounded-full transition-all duration-500';
                    } else if (score >= 50) {
                        scoreBar.className = 'bg-gradient-to-r from-yellow-500 to-orange-400 h-3 rounded-full transition-all duration-500';
                    } else {
                        scoreBar.className = 'bg-gradient-to-r from-red-500 to-red-400 h-3 rounded-full transition-all duration-500';
                    }
                }
            },

            /**
             * Calculates the angle formed by three keypoints (A, B, C) where B is the vertex.
             * Returns the angle in degrees.
             */
            calculateAngle(A, B, C) {
                if (!A || !B || !C) return 180; // Return 180 (straight line) if points are missing for lenient check

                const AB = Math.sqrt(Math.pow(B.x - A.x, 2) + Math.pow(B.y - A.y, 2));
                const BC = Math.sqrt(Math.pow(C.x - B.x, 2) + Math.pow(C.y - B.y, 2));
                const AC = Math.sqrt(Math.pow(C.x - A.x, 2) + Math.pow(C.y - A.y, 2));

                if (AB === 0 || BC === 0) return 180;

                // Law of Cosines
                const cosAngle = (Math.pow(AB, 2) + Math.pow(BC, 2) - Math.pow(AC, 2)) / (2 * AB * BC);
                // Clamp the value to the range [-1, 1] to prevent NaN due to floating point inaccuracies
                const clampedCosAngle = Math.max(-1, Math.min(1, cosAngle));

                const angleRad = Math.acos(clampedCosAngle);
                return (angleRad * 180) / Math.PI;
            },

            /**
             * Checks the detected keypoints against the expected form for the current pose.
             * Returns an array of correction messages.
             */
            checkPose(keypoints, poseName) {
                const getPoint = (name) => {
                    const kp = keypoints.find(k => k.name === name);
                    if (!kp || kp.score < MIN_CONFIDENCE) return null;
                    return { x: kp.x, y: kp.y };
                };

                const leftHip = getPoint('left_hip');
                const leftKnee = getPoint('left_knee');
                const leftAnkle = getPoint('left_ankle');
                const rightHip = getPoint('right_hip');
                const rightKnee = getPoint('right_knee');
                const rightAnkle = getPoint('right_ankle');
                const leftShoulder = getPoint('left_shoulder');
                const rightShoulder = getPoint('right_shoulder');
                const leftElbow = getPoint('left_elbow'); // Needed for arm checks
                const rightElbow = getPoint('right_elbow'); // Needed for arm checks
                const nose = getPoint('nose');
                const leftWrist = getPoint('left_wrist');
                const rightWrist = getPoint('right_wrist');

                let corrections = [];

                // --- Global Visibility Check ---
                if (!leftHip || !rightHip || !leftShoulder || !rightShoulder || !nose) {
                    return [{ message: "Ensure your full body, including your face and hips, is visible.", affected: ['nose', 'left_shoulder', 'right_shoulder', 'left_hip', 'right_hip'] }];
                }

                if (poseName === 'Tadasana') {
                    // Mountain Pose - Perfect Standing Posture with Advanced Biomechanical Analysis
                    
                    // === FOUNDATION: FEET & GROUND CONNECTION ===
                    if (leftAnkle && rightAnkle) {
                        // 1. Optimal foot spacing - hip-width apart for stability
                        const feetDistance = Math.abs(leftAnkle.x - rightAnkle.x);
                        const hipWidth = leftHip && rightHip ? Math.abs(leftHip.x - rightHip.x) : 45;
                        const idealFeetDistance = Math.max(40, hipWidth * 0.9); // Adaptive to body size
                        const tolerance = 20;
                        
                        if (feetDistance < idealFeetDistance - tolerance) {
                            corrections.push({ 
                                message: "Feet: step wider apart for stable foundation (hip-width)", 
                                affected: ['left_ankle', 'right_ankle'], 
                                color: 'yellow',
                                priority: 3
                            });
                        } else if (feetDistance > idealFeetDistance + tolerance + 15) {
                            corrections.push({ 
                                message: "Feet: step closer together, align under hips", 
                                affected: ['left_ankle', 'right_ankle'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                        
                        // 2. Weight distribution - critical for balance
                        const ankleHeightDiff = Math.abs(leftAnkle.y - rightAnkle.y);
                        if (ankleHeightDiff > 12) {
                            corrections.push({ 
                                message: "Balance: distribute weight evenly on both feet", 
                                affected: ['left_ankle', 'right_ankle'], 
                                color: 'red',
                                priority: 1
                            });
                        }
                        
                        // 3. Foot parallel alignment
                        const footAngleCheck = Math.abs(leftAnkle.x - rightAnkle.x) / Math.abs(leftAnkle.y - rightAnkle.y);
                        if (footAngleCheck > 0.3) { // Feet should be roughly parallel
                            corrections.push({ 
                                message: "Feet: keep parallel, toes pointing forward", 
                                affected: ['left_ankle', 'right_ankle'], 
                                color: 'yellow',
                                priority: 4
                            });
                        }
                    }

                    // === LEGS: STRENGTH & MUSCULAR ENGAGEMENT ===
                    // 4. Left leg analysis - strength and alignment
                    if (leftHip && leftKnee && leftAnkle) {
                        const leftKneeAngle = this.calculateAngle(leftHip, leftKnee, leftAnkle);
                        
                        if (leftKneeAngle < 165) {
                            corrections.push({ 
                                message: `Left leg: engage quadriceps, straighten knee (${Math.round(leftKneeAngle)}°)`, 
                                affected: ['left_hip', 'left_knee', 'left_ankle'], 
                                color: 'red',
                                priority: 1
                            });
                        } else if (leftKneeAngle > 190) {
                            corrections.push({ 
                                message: "Left leg: soften knee slightly, avoid hyperextension", 
                                affected: ['left_knee'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                        
                        // Check for knee tracking over ankle
                        const kneeAnkleAlignment = Math.abs(leftKnee.x - leftAnkle.x);
                        if (kneeAnkleAlignment > 25) {
                            corrections.push({ 
                                message: "Left knee: track over ankle, engage inner thigh", 
                                affected: ['left_knee', 'left_ankle'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                    }

                    // 5. Right leg analysis - strength and alignment
                    if (rightHip && rightKnee && rightAnkle) {
                        const rightKneeAngle = this.calculateAngle(rightHip, rightKnee, rightAnkle);
                        
                        if (rightKneeAngle < 165) {
                            corrections.push({ 
                                message: `Right leg: engage quadriceps, straighten knee (${Math.round(rightKneeAngle)}°)`, 
                                affected: ['right_hip', 'right_knee', 'right_ankle'], 
                                color: 'red',
                                priority: 1
                            });
                        } else if (rightKneeAngle > 190) {
                            corrections.push({ 
                                message: "Right leg: soften knee slightly, avoid hyperextension", 
                                affected: ['right_knee'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                        
                        // Check for knee tracking over ankle
                        const kneeAnkleAlignment = Math.abs(rightKnee.x - rightAnkle.x);
                        if (kneeAnkleAlignment > 25) {
                            corrections.push({ 
                                message: "Right knee: track over ankle, engage inner thigh", 
                                affected: ['right_knee', 'right_ankle'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                    }

                    // === PELVIS & CORE: STABILITY CENTER ===
                    if (leftHip && rightHip) {
                        // 6. Hip level alignment - foundation of good posture
                        const hipHeightDiff = Math.abs(leftHip.y - rightHip.y);
                        if (hipHeightDiff > 20) {
                            const higherSide = leftHip.y < rightHip.y ? "left" : "right";
                            corrections.push({ 
                                message: `Pelvis: level hips, lower ${higherSide} hip slightly`, 
                                affected: ['left_hip', 'right_hip'], 
                                color: 'red',
                                priority: 1
                            });
                        }
                        
                        // 7. Hip width and pelvic alignment
                        const hipWidth = Math.abs(leftHip.x - rightHip.x);
                        if (hipWidth < 30) {
                            corrections.push({ 
                                message: "Pelvis: widen stance slightly, ground through both legs", 
                                affected: ['left_hip', 'right_hip'], 
                                color: 'yellow',
                                priority: 4
                            });
                        }
                        
                        // 8. Pelvic tilt assessment
                        if (leftKnee && rightKnee) {
                            const avgHipY = (leftHip.y + rightHip.y) / 2;
                            const avgKneeY = (leftKnee.y + rightKnee.y) / 2;
                            const hipKneeRatio = (avgHipY - avgKneeY);
                            
                            if (hipKneeRatio < 60) {
                                corrections.push({ 
                                    message: "Pelvis: lengthen tailbone down, engage core gently", 
                                    affected: ['left_hip', 'right_hip'], 
                                    color: 'yellow',
                                    priority: 3
                                });
                            }
                        }
                    }

                    // === SPINE & TORSO: AXIAL ELONGATION ===
                    if (leftShoulder && rightShoulder && leftHip && rightHip) {
                        // 9. Spinal alignment - shoulders over hips
                        const avgShoulderX = (leftShoulder.x + rightShoulder.x) / 2;
                        const avgHipX = (leftHip.x + rightHip.x) / 2;
                        const spinalAlignment = Math.abs(avgShoulderX - avgHipX);
                        
                        if (spinalAlignment > 25) {
                            if (avgShoulderX < avgHipX) {
                                corrections.push({ 
                                    message: "Spine: bring chest forward, shoulders over hips", 
                                    affected: ['left_shoulder', 'right_shoulder'], 
                                    color: 'red',
                                    priority: 1
                                });
                            } else {
                                corrections.push({ 
                                    message: "Spine: draw shoulders back over hips", 
                                    affected: ['left_shoulder', 'right_shoulder'], 
                                    color: 'red',
                                    priority: 1
                                });
                            }
                        }
                        
                        // 10. Torso length and chest opening
                        const avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
                        const avgHipY = (leftHip.y + rightHip.y) / 2;
                        const torsoLength = avgHipY - avgShoulderY;
                        
                        if (torsoLength < 70) {
                            corrections.push({ 
                                message: "Chest: lift sternum, lengthen through crown of head", 
                                affected: ['left_shoulder', 'right_shoulder'], 
                                color: 'yellow',
                                priority: 2
                            });
                        }
                        
                        // 11. Rib cage alignment
                        const shoulderHipRatio = torsoLength / Math.abs(avgShoulderX - avgHipX);
                        if (shoulderHipRatio < 2.5) {
                            corrections.push({ 
                                message: "Ribs: draw front ribs down, lengthen back of neck", 
                                affected: ['left_shoulder', 'right_shoulder'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                    }

                    // === SHOULDERS: RELAXED STRENGTH ===
                    if (leftShoulder && rightShoulder) {
                        // 12. Shoulder level and relaxation
                        const shoulderHeightDiff = Math.abs(leftShoulder.y - rightShoulder.y);
                        if (shoulderHeightDiff > 20) {
                            const higherShoulder = leftShoulder.y < rightShoulder.y ? "left" : "right";
                            corrections.push({ 
                                message: `Shoulders: relax ${higherShoulder} shoulder down, release tension`, 
                                affected: ['left_shoulder', 'right_shoulder'], 
                                color: 'yellow',
                                priority: 2
                            });
                        }
                        
                        // 13. Shoulder blade engagement
                        const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);
                        if (shoulderWidth < 55) {
                            corrections.push({ 
                                message: "Shoulders: broaden collarbones, draw shoulder blades down back", 
                                affected: ['left_shoulder', 'right_shoulder'], 
                                color: 'yellow',
                                priority: 2
                            });
                        } else if (shoulderWidth > 90) {
                            corrections.push({ 
                                message: "Shoulders: soften shoulder blades toward spine", 
                                affected: ['left_shoulder', 'right_shoulder'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                    }

                    // === ARMS: NATURAL EXTENSION ===
                    if (leftShoulder && leftElbow && leftWrist && rightShoulder && rightElbow && rightWrist) {
                        // 14. Arm positioning and energy
                        const leftArmAngle = this.calculateAngle(leftShoulder, leftElbow, leftWrist);
                        const rightArmAngle = this.calculateAngle(rightShoulder, rightElbow, rightWrist);
                        
                        if (leftArmAngle < 155) {
                            corrections.push({ 
                                message: "Left arm: lengthen, let energy flow through fingertips", 
                                affected: ['left_elbow', 'left_wrist'], 
                                color: 'yellow',
                                priority: 4
                            });
                        }
                        
                        if (rightArmAngle < 155) {
                            corrections.push({ 
                                message: "Right arm: lengthen, let energy flow through fingertips", 
                                affected: ['right_elbow', 'right_wrist'], 
                                color: 'yellow',
                                priority: 4
                            });
                        }
                        
                        // 15. Hand positioning relative to body
                        const leftHandOffset = Math.abs(leftWrist.x - leftShoulder.x);
                        const rightHandOffset = Math.abs(rightWrist.x - rightShoulder.x);
                        
                        if (leftHandOffset > 45) {
                            corrections.push({ 
                                message: "Left arm: draw closer to side body, palms face forward", 
                                affected: ['left_wrist'], 
                                color: 'yellow',
                                priority: 4
                            });
                        }
                        
                        if (rightHandOffset > 45) {
                            corrections.push({ 
                                message: "Right arm: draw closer to side body, palms face forward", 
                                affected: ['right_wrist'], 
                                color: 'yellow',
                                priority: 4
                            });
                        }
                        
                        // 16. Arm symmetry
                        const armSymmetry = Math.abs(leftArmAngle - rightArmAngle);
                        if (armSymmetry > 15) {
                            corrections.push({ 
                                message: "Arms: create symmetry, both arms equally engaged", 
                                affected: ['left_wrist', 'right_wrist'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                    }

                    // === HEAD & NECK: CROWN ENERGY ===
                    if (nose && leftShoulder && rightShoulder) {
                        // 17. Head positioning over shoulders
                        const avgShoulderX = (leftShoulder.x + rightShoulder.x) / 2;
                        const headAlignment = Math.abs(nose.x - avgShoulderX);
                        
                        if (headAlignment > 35) {
                            if (nose.x < avgShoulderX) {
                                corrections.push({ 
                                    message: "Head: draw chin back, lengthen back of neck", 
                                    affected: ['nose'], 
                                    color: 'red',
                                    priority: 1
                                });
                            } else {
                                corrections.push({ 
                                    message: "Head: center over shoulders, neutral neck", 
                                    affected: ['nose'], 
                                    color: 'red',
                                    priority: 1
                                });
                            }
                        }
                        
                        // 18. Neck length and crown reach
                        const avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
                        const neckLength = avgShoulderY - nose.y;
                        
                        if (neckLength < 35) {
                            corrections.push({ 
                                message: "Crown: reach up through top of head, lift from base of skull", 
                                affected: ['nose'], 
                                color: 'yellow',
                                priority: 2
                            });
                        }
                        
                        // 19. Jaw and facial relaxation
                        if (neckLength > 65) {
                            corrections.push({ 
                                message: "Neck: soften, avoid over-lifting chin", 
                                affected: ['nose'], 
                                color: 'yellow',
                                priority: 3
                            });
                        }
                    }

                    // === ENERGETIC ALIGNMENT & BREATH ===
                    // 20. Overall body line assessment
                    if (leftAnkle && rightAnkle && leftHip && rightHip && leftShoulder && rightShoulder && nose) {
                        const avgAnkleX = (leftAnkle.x + rightAnkle.x) / 2;
                        const avgHipX = (leftHip.x + rightHip.x) / 2;
                        const avgShoulderX = (leftShoulder.x + rightShoulder.x) / 2;
                        
                        const ankleHipAlignment = Math.abs(avgAnkleX - avgHipX);
                        const hipShoulderAlignment = Math.abs(avgHipX - avgShoulderX);
                        const shoulderHeadAlignment = Math.abs(avgShoulderX - nose.x);
                        
                        const totalAlignment = ankleHipAlignment + hipShoulderAlignment + shoulderHeadAlignment;
                        
                        if (totalAlignment > 80) {
                            corrections.push({ 
                                message: "Alignment: create one line from crown to feet, engage core", 
                                affected: ['nose', 'left_shoulder', 'right_shoulder', 'left_hip', 'right_hip'], 
                                color: 'red',
                                priority: 1
                            });
                        }
                    }

                    // === PRIORITY-BASED FEEDBACK SYSTEM ===
                    // Sort corrections by priority (1 = most critical, 4 = refinement)
                    corrections.sort((a, b) => (a.priority || 5) - (b.priority || 5));
                    
                    // Limit to top 3 most important corrections to avoid overwhelm
                    if (corrections.length > 3) {
                        corrections = corrections.slice(0, 3);
                    }
                    
                    // === POSITIVE REINFORCEMENT ===
                    if (corrections.length === 0) {
                        corrections.push({ 
                            message: "Perfect Tadasana! Feel the mountain's strength. Breathe deeply and hold.", 
                            affected: [], 
                            color: 'green',
                            priority: 0
                        });
                    } else {
                        // Count critical vs minor issues
                        const criticalIssues = corrections.filter(c => c.color === 'red').length;
                        const minorIssues = corrections.filter(c => c.color === 'yellow').length;
                        
                        if (criticalIssues === 0 && minorIssues <= 2) {
                            corrections.unshift({ 
                                message: "Excellent foundation! Small refinements will perfect your Mountain Pose.", 
                                affected: [], 
                                color: 'green',
                                priority: 0
                            });
                        } else if (criticalIssues <= 1) {
                            corrections.unshift({ 
                                message: "Good alignment! Focus on these key adjustments:", 
                                affected: [], 
                                color: 'blue',
                                priority: 0
                            });
                        }
                    }

                } else if (poseName === 'Adho Mukha Svanasana') {
                    // Downward Dog

                    // 1. Torso/Arm Alignment (Arms should be straight, a line from wrist to shoulder)
                    if (leftShoulder && leftElbow && leftWrist) {
                        const armAngle = this.calculateAngle(leftShoulder, leftElbow, leftWrist);
                        if (armAngle < 160) {
                            corrections.push({ message: "Straighten your arms fully. Press through your palms.", affected: ['left_shoulder', 'left_elbow', 'left_wrist'], color: 'red' });
                        }
                    }

                    // 2. Leg Straightness (If not straight, provide a correction)
                    if (leftHip && leftKnee && leftAnkle) {
                        const legAngle = this.calculateAngle(leftHip, leftKnee, leftAnkle);
                        if (legAngle < 160) {
                            corrections.push({ message: "Straighten your legs more. It's okay if your heels don't touch the floor.", affected: ['left_hip', 'left_knee', 'left_ankle'], color: 'yellow' });
                        }
                    }

                    // 3. Hips lifted (Simple check: hips should be higher than shoulders)
                    if (leftHip && leftShoulder) {
                        if (leftHip.y < leftShoulder.y) {
                            corrections.push({ message: "Lift your hips higher and press your chest toward your thighs.", affected: ['left_hip', 'left_shoulder'], color: 'red' });
                        }
                    }

                } else if (poseName === 'Virabhadrasana III') {
                    // Warrior III

                    // 1. Back Leg Straightness (Assume left leg back for balance)
                    if (leftHip && leftKnee && leftAnkle) {
                        const legAngle = this.calculateAngle(leftHip, leftKnee, leftAnkle);
                        // The knee should be fully straight, close to 180, but relative to the body angle it's a small angle when parallel to the ground.
                        // Let's check for knee bend in the back leg.
                        if (legAngle < 170) {
                            corrections.push({ message: "Fully straighten your back (left) leg.", affected: ['left_knee', 'left_ankle'], color: 'red' });
                        }
                    }

                    // 2. Torso Parallel to Ground (hip to shoulder horizontal) - Simple Y-coordinate difference check
                    if (leftHip && leftShoulder) {
                        const torsoVerticalDifference = Math.abs(leftShoulder.y - leftHip.y);
                        // A large difference means the torso is too upright or dipped too low. The torso should be horizontal, meaning Y coordinates are similar.
                        if (torsoVerticalDifference > 30) {
                            corrections.push({ message: "Align your torso so it's parallel to the ground.", affected: ['left_shoulder', 'left_hip'], color: 'red' });
                        }
                    }

                    // 3. Arms Forward (Shoulder-Elbow-Wrist should be relatively straight)
                    if (leftShoulder && leftElbow && leftWrist) {
                        const armAngle = this.calculateAngle(leftShoulder, leftElbow, leftWrist);
                        if (armAngle < 160) {
                            corrections.push({ message: "Extend your arms fully forward (keep elbows straight).", affected: ['left_shoulder', 'left_elbow', 'left_wrist'], color: 'yellow' });
                        }
                    }
                } else if (poseName === 'Namastey') {
                    // Namastey (Prayer Pose) - Standing with hands in prayer at heart center

                    // 1. Feet together
                    if (leftAnkle && rightAnkle) {
                        const feetDistance = Math.abs(leftAnkle.x - rightAnkle.x);
                        if (feetDistance > 30) {
                            corrections.push({ message: "Feet: bring closer together", affected: ['left_ankle', 'right_ankle'], color: 'yellow' });
                        }
                    }

                    // 2. Hands pressed together at chest level
                    if (leftWrist && rightWrist) {
                        const handsDistance = Math.abs(leftWrist.x - rightWrist.x);
                        if (handsDistance > 25) {
                            corrections.push({ message: "Hands: press palms together", affected: ['left_wrist', 'right_wrist'], color: 'red' });
                        }

                        // Approximate chest level using average shoulder Y
                        if (leftShoulder && rightShoulder) {
                            const chestY = (leftShoulder.y + rightShoulder.y) / 2;
                            const avgHandY = (leftWrist.y + rightWrist.y) / 2;
                            if (Math.abs(avgHandY - chestY) > 60) {
                                corrections.push({ message: "Hands: raise to heart level", affected: ['left_wrist', 'right_wrist'], color: 'yellow' });
                            }
                        }
                    }

                    // 3. Straight posture (similar to Tadasana legs and hips)
                    if (leftHip && leftKnee && leftAnkle) {
                        const leftKneeAngle = this.calculateAngle(leftHip, leftKnee, leftAnkle);
                        if (leftKneeAngle < 165) corrections.push({ message: `Left leg: straighten (${Math.round(leftKneeAngle)}°)`, affected: ['left_knee', 'left_ankle'], color: 'yellow' });
                    }
                    if (rightHip && rightKnee && rightAnkle) {
                        const rightKneeAngle = this.calculateAngle(rightHip, rightKnee, rightAnkle);
                        if (rightKneeAngle < 165) corrections.push({ message: `Right leg: straighten (${Math.round(rightKneeAngle)}°)`, affected: ['right_knee', 'right_ankle'], color: 'yellow' });
                    }
                } else if (poseName === 'Natarajasana') {
                    // Lord of the Dance Pose - Balancing on one leg, grabbing back foot

                    // Assume right leg standing, left leg bent back
                    if (rightHip && rightKnee && rightAnkle) {
                        const rightKneeAngle = this.calculateAngle(rightHip, rightKnee, rightAnkle);
                        if (rightKneeAngle < 170) corrections.push({ message: "Straighten your standing (right) leg fully.", affected: ['right_knee', 'right_ankle'], color: 'red' });
                    }

                    if (leftHip && leftKnee && leftAnkle) {
                        // Back leg should be bent, knee angle around 90-120 degrees
                        const leftKneeAngle = this.calculateAngle(leftHip, leftKnee, leftAnkle);
                        if (leftKneeAngle > 140 || leftKneeAngle < 80) corrections.push({ message: "Bend your back (left) leg more, aiming for a 90-degree knee bend.", affected: ['left_knee', 'left_ankle'], color: 'yellow' });
                    }

                    // Arms extended
                    if (rightShoulder && rightElbow && rightWrist) {
                        const rightArmAngle = this.calculateAngle(rightShoulder, rightElbow, rightWrist);
                        if (rightArmAngle < 160) corrections.push({ message: "Extend your front arm straight forward.", affected: ['right_elbow', 'right_wrist'], color: 'yellow' });
                    }

                    // Hips level for balance
                    if (leftHip && rightHip) {
                        const hipDifference = Math.abs(leftHip.y - rightHip.y);
                        if (hipDifference > 40) corrections.push({ message: "Keep hips level to maintain balance.", affected: ['left_hip', 'right_hip'], color: 'red' });
                    }
                } else if (poseName === 'Vrikshasana') {
                    // Tree Pose - Foot on inner thigh, hands in prayer

                    // Standing leg straight
                    if (leftHip && leftKnee && leftAnkle) {
                        const leftKneeAngle = this.calculateAngle(leftHip, leftKnee, leftAnkle);
                        if (leftKneeAngle < 165) corrections.push({ message: `Standing leg: straighten (${Math.round(leftKneeAngle)}°)`, affected: ['left_knee', 'left_ankle'], color: 'red' });
                    }

                    // Bent leg foot position
                    if (rightHip && rightKnee && rightAnkle) {
                        const rightKneeAngle = this.calculateAngle(rightHip, rightKnee, rightAnkle);
                        if (rightKneeAngle < 80) corrections.push({ message: "Right foot: place higher on thigh", affected: ['right_knee', 'right_ankle'], color: 'yellow' });
                    }

                    // Hands in prayer at chest
                    if (leftWrist && rightWrist) {
                        const handsDistance = Math.abs(leftWrist.x - rightWrist.x);
                        if (handsDistance > 25) corrections.push({ message: "Hands: press palms together", affected: ['left_wrist', 'right_wrist'], color: 'yellow' });
                    }

                    // Hips forward
                    if (leftHip && rightHip) {
                        const hipAngle = Math.abs(leftHip.x - rightHip.x);
                        if (hipAngle > 60) corrections.push({ message: "Hips: square forward", affected: ['left_hip', 'right_hip'], color: 'yellow' });
                    }
                } else if (poseName === 'Baddha Konasana') {
                    // Bound Angle Pose - Seated, soles together, knees out

                    // Knees should be lower than hips
                    if (leftHip && leftKnee) {
                        if (leftKnee.y > leftHip.y) corrections.push({ message: "Lower your left knee toward the floor.", affected: ['left_knee'], color: 'yellow' });
                    }
                    if (rightHip && rightKnee) {
                        if (rightKnee.y > rightHip.y) corrections.push({ message: "Lower your right knee toward the floor.", affected: ['right_knee'], color: 'yellow' });
                    }

                    // Feet close to pelvis - check ankle positions relative to hips
                    if (leftHip && leftAnkle && rightAnkle) {
                        const feetDistance = Math.abs(leftAnkle.x - rightAnkle.x);
                        if (feetDistance > 60) corrections.push({ message: "Bring soles of feet closer to your pelvis.", affected: ['left_ankle', 'right_ankle'], color: 'yellow' });
                    }

                    // Back straight - shoulders over hips
                    if (leftShoulder && rightShoulder && leftHip && rightHip) {
                        const avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
                        const avgHipY = (leftHip.y + rightHip.y) / 2;
                        if (avgShoulderY > avgHipY + 20) corrections.push({ message: "Lengthen your spine, lift chest forward.", affected: ['left_shoulder', 'right_shoulder'], color: 'yellow' });
                    }
                }

                // If no specific corrections, but all keypoints are visible, provide a positive message.
                if (corrections.length === 0) {
                    corrections.push({ message: `You are holding ${poseName} well! Focus on your breath.`, color: 'green' });
                }

                return corrections;
            },

            /**
             * Initializes the camera and TensorFlow MoveNet model.
             */
            async startARAssessment() {
                const video = document.getElementById('video-feed');
                const canvas = document.getElementById('ar-canvas');
                const ctx = canvas.getContext('2d');
                const statusDiv = document.getElementById('camera-status');
                const statusText = document.getElementById('status-text');
                const errorText = document.getElementById('error-message');
                const feedbackText = document.getElementById('current-feedback-text');

                const updateStatus = (message, isError = false) => {
                    statusText.textContent = message;
                    if (isError) {
                        errorText.textContent = message;
                        errorText.classList.remove('hidden');
                        statusText.classList.add('hidden');
                    } else {
                        errorText.classList.add('hidden');
                        statusText.classList.remove('hidden');
                    }
                    statusDiv.classList.remove('hidden');
                };

                updateStatus("Loading MoveNet model...");

                // Clear any running animation frame before starting a new one
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }

                // Clean up previous video stream if it exists
                if (this.videoStream) {
                    this.videoStream.getTracks().forEach(track => track.stop());
                }


                // 1. Load Model
                if (!this.detector) {
                    try {
                        const model = poseDetection.SupportedModels.MoveNet;
                        const detectorConfig = {
                            modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
                            defaultUrl: 'https://tfhub.dev/google/movenet/singlepose/lightning/4',
                        };
                        this.detector = await poseDetection.createDetector(model, detectorConfig);
                        updateStatus("Model loaded. Requesting camera access...");
                    } catch (e) {
                        updateStatus(`Failed to load MoveNet model: ${e.message}`, true);
                        console.error(e);
                        return;
                    }
                }

                // 2. Get Camera Stream
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then((stream) => {
                        this.videoStream = stream;
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play();

                            // Set canvas dimensions to match video stream
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;

                            // Show video container
                            const videoContainer = document.getElementById('video-container');
                            const feedbackArea = document.getElementById('feedback-area');

                            if (videoContainer) videoContainer.style.display = 'block';
                            if (statusDiv) statusDiv.classList.add('hidden');
                            if (feedbackArea) feedbackArea.style.display = 'block';
                            if (feedbackText) feedbackText.textContent = `Starting ${this.currentPose} analysis... Stand in position!`;

                            // Start the ML loop, passing video reference
                            this.poseDetectionFrame(video, ctx, this.detector, feedbackText);
                        };
                    })
                    .catch((err) => {
                        console.error("Camera access error:", err);
                        updateStatus("Permission denied or camera is in use. Please enable camera access.", true);
                    });
            },

            /**
             * Main loop for MoveNet pose detection and drawing.
             */
            async poseDetectionFrame(video, ctx, detector, feedbackText) {
                // Request next frame first to allow browser to manage repaint speed
                this.animationFrameId = requestAnimationFrame(() => this.poseDetectionFrame(video, ctx, detector, feedbackText));

                if (detector && video.readyState === 4) {
                    const poses = await detector.estimatePoses(video);

                    // Clear the canvas
                    ctx.clearRect(0, 0, video.videoWidth, video.videoHeight);

                    if (poses.length > 0) {
                        const pose = poses[0];
                        const keypoints = pose.keypoints;

                        // 1. Correction Logic - Get corrections with affected parts
                        let affectedKeypoints = new Set(); // Track all affected keypoints for coloring
                        let corrections = [];

                        if (this.currentPose) {
                            corrections = this.checkPose(keypoints, this.currentPose.split('(')[0].trim());

                            // Aggregate affected keypoints for drawing
                            corrections.forEach(c => {
                                if (c.affected) {
                                    c.affected.forEach(kpName => affectedKeypoints.add(kpName));
                                }
                            });

                            // === STABILIZED SUGGESTIONS ===
                            // Only update suggestion every BUFFER_SIZE frames
                            correctionCounter++;

                            if (correctionCounter >= BUFFER_SIZE) {
                                // Time to update the suggestion
                                stableSuggestion = corrections.length > 0 ? corrections[0] : { message: "Great! Hold this pose.", color: 'green' };
                                correctionCounter = 0; // Reset counter
                            }

                            // Use stable suggestion for display
                            const displayCorrection = stableSuggestion || corrections[0] || { message: "Analyzing pose...", color: 'gray' };

                            // Display stabilized feedback message
                            feedbackText.textContent = displayCorrection.message;

                            // Update feedback color based on stabilized suggestion
                            if (displayCorrection.color === 'red') {
                                feedbackText.classList.remove('text-green-400', 'text-yellow-400', 'text-gray-400');
                                feedbackText.classList.add('text-red-400');
                            } else if (displayCorrection.color === 'yellow') {
                                feedbackText.classList.remove('text-green-400', 'text-red-400', 'text-gray-400');
                                feedbackText.classList.add('text-yellow-400');
                            } else if (displayCorrection.color === 'green') {
                                feedbackText.classList.remove('text-red-400', 'text-yellow-400', 'text-gray-400');
                                feedbackText.classList.add('text-green-400');
                            } else {
                                feedbackText.classList.remove('text-red-400', 'text-yellow-400', 'text-green-400');
                                feedbackText.classList.add('text-gray-400');
                            }

                            // === SCORING SYSTEM ===
                            // Enhanced scoring system for Tadasana with weighted criteria
                            let frameScore = 100;
                            let majorErrors = 0;
                            let minorErrors = 0;
                            let criticalErrors = 0;

                            if (this.currentPose && this.currentPose.includes('Tadasana')) {
                                // Tadasana-specific scoring with weighted importance based on priority
                                corrections.forEach(corr => {
                                    const priority = corr.priority || 5;
                                    
                                    if (corr.color === 'red') {
                                        if (priority === 1) {
                                            // Critical alignment issues (balance, major postural problems)
                                            criticalErrors++;
                                            frameScore -= 25; // Heavy penalty for critical issues
                                        } else {
                                            majorErrors++;
                                            frameScore -= 15; // Standard red correction penalty
                                        }
                                    } else if (corr.color === 'yellow') {
                                        if (priority <= 2) {
                                            // Important refinements
                                            minorErrors++;
                                            frameScore -= 10; // Medium penalty for important refinements
                                        } else if (priority === 3) {
                                            // Moderate refinements
                                            minorErrors++;
                                            frameScore -= 6; // Small penalty for moderate issues
                                        } else {
                                            // Minor refinements (priority 4+)
                                            minorErrors++;
                                            frameScore -= 3; // Minimal penalty for minor adjustments
                                        }
                                    } else if (corr.color === 'green') {
                                        // Bonus for perfect alignment
                                        if (corr.message.includes('Perfect Tadasana') || corr.message.includes('Excellent foundation')) {
                                            frameScore = Math.min(100, frameScore + 8);
                                        }
                                    } else if (corr.color === 'blue') {
                                        // Good alignment bonus
                                        frameScore = Math.min(100, frameScore + 3);
                                    }
                                });
                                
                                // Additional stability bonuses for Tadasana
                                if (criticalErrors === 0) {
                                    frameScore = Math.min(100, frameScore + 5); // Bonus for no critical errors
                                    
                                    if (majorErrors === 0) {
                                        frameScore = Math.min(100, frameScore + 5); // Additional bonus for no major errors
                                        
                                        if (minorErrors <= 1) {
                                            frameScore = Math.min(100, frameScore + 5); // Perfect or near-perfect pose
                                        }
                                    }
                                }
                                
                                // Penalize multiple issues more heavily (compound effect)
                                const totalIssues = criticalErrors + majorErrors + minorErrors;
                                if (totalIssues > 3) {
                                    frameScore -= (totalIssues - 3) * 3; // Additional penalty for multiple issues
                                }
                                
                            } else {
                                // Default scoring for other poses
                                corrections.forEach(corr => {
                                    if (corr.color === 'red') {
                                        frameScore -= 15; // Major error
                                    } else if (corr.color === 'yellow') {
                                        frameScore -= 8; // Minor warning
                                    }
                                });
                            }

                            // Keep score between 0-100
                            frameScore = Math.max(0, Math.min(100, frameScore));

                            // Add to score history and calculate average
                            scoreHistory.push(frameScore);
                            if (scoreHistory.length > 30) { // Keep last 30 frames (about 1 second)
                                scoreHistory.shift();
                            }

                            // Calculate average score for smoother display
                            poseScore = scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length;

                            // Update score display
                            this.updateScore(poseScore);

                            // === COURSE PROGRESS TRACKING ===
                            app.checkCourseProgress(poseScore);

                            // === MILESTONE TRACKING ===
                            // Track high accuracy for milestone rewards
                            if (poseScore >= 70 && milestonesEarned < 2) {
                                highAccuracyTimer++;

                                // 10 seconds at ~30fps = 300 frames
                                if (highAccuracyTimer >= 300 && Date.now() - lastMilestoneTime > 1000) {
                                    milestonesEarned++;
                                    localStorage.setItem('milestonesEarned', milestonesEarned.toString());
                                    lastMilestoneTime = Date.now();
                                    highAccuracyTimer = 0;

                                    // Show celebration message
                                    feedbackText.textContent = `🎉 Milestone ${milestonesEarned} Earned! Great job!`;
                                    feedbackText.classList.remove('text-red-400', 'text-yellow-400', 'text-gray-400');
                                    feedbackText.classList.add('text-green-400');

                                    console.log(`Milestone ${milestonesEarned} achieved!`);
                                }
                            } else {
                                // Reset timer if accuracy drops below 70%
                                highAccuracyTimer = 0;
                            }

                            // Log all corrections to the correction log panel (much less frequently for TTS)
                            // Update every 200 frames = ~6-7 seconds at 30fps
                            if (correctionCounter % 200 === 0) {
                                this.logCorrections(corrections);
                                // Speak corrections if TTS is enabled
                                if (this.ttsEnabled && corrections.length > 0) {
                                    this.speakCorrection(corrections[0].message);
                                }
                            }

                        } else {
                            feedbackText.textContent = "Select a pose to begin tracking!";
                        }

                        // 2. Drawing Logic
                        this.drawKeypoints(video, keypoints, ctx, affectedKeypoints, corrections);
                        this.drawSkeleton(video, keypoints, ctx, affectedKeypoints, corrections);

                        // 3. Draw Score on Canvas (Fix mirrored text)
                        if (this.currentPose) {
                            // Save the current canvas state
                            ctx.save();

                            // Flip horizontally to un-mirror the text
                            ctx.scale(-1, 1);

                            ctx.font = 'bold 48px Inter, sans-serif';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'top';

                            // Add shadow for better visibility
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                            ctx.shadowBlur = 10;
                            ctx.shadowOffsetX = 2;
                            ctx.shadowOffsetY = 2;

                            // Color based on score
                            if (poseScore >= 85) {
                                ctx.fillStyle = '#10B981'; // Green
                            } else if (poseScore >= 70) {
                                ctx.fillStyle = '#FFEB3B'; // Yellow/Gold
                            } else {
                                ctx.fillStyle = '#EF4444'; // Red
                            }

                            // Draw score (negative x because canvas is flipped)
                            ctx.fillText(Math.round(poseScore), -video.videoWidth + 20, 20);

                            // Restore the canvas state
                            ctx.restore();
                        }

                    } else {
                        // No pose detected
                        feedbackText.textContent = this.currentPose ? `No person detected. Stand further back or adjust lighting.` : 'Select a pose to begin tracking!';
                    }
                }
            },

            /**
             * Logs corrections to the correction log panel (max 5 recent corrections displayed).
             */
            logCorrections(corrections) {
                if (!this.correctionHistory) this.correctionHistory = [];

                const correctionLog = document.getElementById('correction-log');
                if (!correctionLog) return;

                // Add only non-duplicate corrections to history (avoid spamming same message)
                corrections.forEach(corr => {
                    const corrText = corr.message;
                    const lastCorr = this.correctionHistory[this.correctionHistory.length - 1];

                    // Only add if it's different from the last logged correction
                    if (!lastCorr || lastCorr !== corrText) {
                        this.correctionHistory.push(corrText);

                        // Keep only last 5 corrections
                        if (this.correctionHistory.length > 5) {
                            this.correctionHistory.shift();
                        }

                        // Update the log display
                        const logHtml = '<p class="text-xs text-gray-500 font-semibold mb-2">Correction Log & Suggestions:</p>' +
                            this.correctionHistory.map((msg, idx) => {
                                let icon = '•';
                                let colorClass = 'text-gray-400';

                                if (msg.includes('well') || msg.includes('perfect') || msg.includes('breath')) {
                                    icon = '✓';
                                    colorClass = 'text-green-400';
                                } else if (msg.toLowerCase().includes('cannot')) {
                                    icon = '⚠';
                                    colorClass = 'text-yellow-400';
                                } else if (corrections.find(c => c.message === msg && c.color === 'red')) {
                                    icon = '✗';
                                    colorClass = 'text-red-400';
                                } else if (corrections.find(c => c.message === msg && c.color === 'yellow')) {
                                    icon = '⚠';
                                    colorClass = 'text-yellow-400';
                                }

                                return `<p class="text-xs ${colorClass} pl-2"><span class="font-bold">${icon}</span> ${msg}</p>`;
                            }).join('');

                        correctionLog.innerHTML = logHtml;

                        // Auto-scroll to latest correction
                        correctionLog.scrollTop = correctionLog.scrollHeight;
                    }
                });
            },

            /**
             * Draws circles on the keypoints detected by MoveNet with enhanced color coding for Tadasana.
             */
            drawKeypoints(video, keypoints, ctx, affectedKeypoints, corrections) {
                if (!keypoints || !ctx) return;
                affectedKeypoints = affectedKeypoints || new Set();
                corrections = corrections || [];

                keypoints.forEach((keypoint, index) => {
                    if (keypoint.score > MIN_CONFIDENCE) {
                        // Use coordinates directly since canvas is mirrored via CSS
                        const x = keypoint.x;
                        const y = keypoint.y;

                        // Enhanced color determination for Tadasana
                        let fillColor = '#42A5F5'; // Default blue
                        let strokeColor = '#FFFFFF'; // Default white border
                        let radius = 5; // Default radius
                        
                        const keypointName = Object.keys(keypointIndices).find(name => keypointIndices[name] === index);

                        if (keypointName && affectedKeypoints.has(keypointName)) {
                            // Check correction severity and type
                            const corr = corrections.find(c => c.affected && c.affected.includes(keypointName));
                            if (corr) {
                                if (corr.color === 'red') {
                                    // Critical errors - larger, pulsing red
                                    fillColor = '#EF4444';
                                    strokeColor = '#FCA5A5';
                                    radius = 7;
                                    
                                    // Add pulsing effect for critical errors
                                    const pulseIntensity = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
                                    ctx.globalAlpha = pulseIntensity;
                                } else if (corr.color === 'yellow') {
                                    // Minor warnings - amber/orange
                                    fillColor = '#F59E0B';
                                    strokeColor = '#FCD34D';
                                    radius = 6;
                                } else if (corr.color === 'green') {
                                    // Perfect alignment - bright green with glow
                                    fillColor = '#10B981';
                                    strokeColor = '#6EE7B7';
                                    radius = 6;
                                    
                                    // Add subtle glow for perfect points
                                    ctx.shadowColor = '#10B981';
                                    ctx.shadowBlur = 10;
                                }
                            }
                        } else if (keypoint.score > 0.8) {
                            // High confidence points - bright white
                            fillColor = '#FFFFFF';
                            strokeColor = '#E5E7EB';
                        } else if (keypoint.score > 0.6) {
                            // Medium confidence - light blue
                            fillColor = '#60A5FA';
                            strokeColor = '#DBEAFE';
                        }

                        // Draw the keypoint
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = fillColor;
                        ctx.fill();

                        // Add border for contrast
                        ctx.strokeStyle = strokeColor;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        
                        // Reset effects
                        ctx.globalAlpha = 1.0;
                        ctx.shadowBlur = 0;
                        
                        // Add keypoint labels for critical points in Tadasana
                        if (this.currentPose && this.currentPose.includes('Tadasana') && 
                            ['left_ankle', 'right_ankle', 'left_hip', 'right_hip', 'left_shoulder', 'right_shoulder', 'nose'].includes(keypointName)) {
                            
                            ctx.font = '10px Inter, sans-serif';
                            ctx.fillStyle = '#FFFFFF';
                            ctx.textAlign = 'center';
                            ctx.fillText(keypointName.split('_')[1] || keypointName, x, y - radius - 5);
                        }
                    }
                });
            },

            /**
             * Draws lines connecting the keypoints detected by MoveNet with color coding.
             */
            drawSkeleton(video, keypoints, ctx, affectedKeypoints, corrections) {
                if (!keypoints || !ctx) return;
                affectedKeypoints = affectedKeypoints || new Set();
                corrections = corrections || [];

                ctx.lineWidth = 3;

                SKELETON_CONNECTIONS.forEach(([i, j]) => {
                    const kp1 = keypoints[i];
                    const kp2 = keypoints[j];

                    if (kp1 && kp2 && kp1.score > MIN_CONFIDENCE && kp2.score > MIN_CONFIDENCE) {

                        const kp1Name = Object.keys(keypointIndices).find(name => keypointIndices[name] === i);
                        const kp2Name = Object.keys(keypointIndices).find(name => keypointIndices[name] === j);

                        let lineColor = '#1E88E5'; // Default line color (Secondary Blue)
                        let corrColor = null;

                        // Check if either keypoint in the connection is part of a severe correction (red or yellow)
                        if (affectedKeypoints.has(kp1Name) || affectedKeypoints.has(kp2Name)) {
                            const relevantCorrections = corrections.filter(c =>
                                c.affected && (c.affected.includes(kp1Name) || c.affected.includes(kp2Name))
                            );

                            // Prioritize the worst color (red > yellow > green)
                            if (relevantCorrections.some(c => c.color === 'red')) {
                                corrColor = 'red';
                            } else if (relevantCorrections.some(c => c.color === 'yellow')) {
                                corrColor = 'yellow';
                            } else if (relevantCorrections.some(c => c.color === 'green')) {
                                corrColor = 'green';
                            }
                        }

                        if (corrColor === 'red') {
                            lineColor = '#EF4444'; // Red
                        } else if (corrColor === 'yellow') {
                            lineColor = '#F59E0B'; // Yellow
                        } else if (corrColor === 'green') {
                            lineColor = '#10B981'; // Green
                        }

                        ctx.strokeStyle = lineColor;
                        ctx.beginPath();

                        // Use coordinates directly since canvas is mirrored via CSS
                        const p1x = kp1.x;
                        const p1y = kp1.y;
                        const p2x = kp2.x;
                        const p2y = kp2.y;

                        ctx.moveTo(p1x, p1y);
                        ctx.lineTo(p2x, p2y);
                        ctx.stroke();
                    }
                });
            },

            /**
             * Stops the AR session and frees resources.
             */
            stopARAssessment() {
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
                if (this.videoStream) {
                    this.videoStream.getTracks().forEach(track => track.stop());
                    this.videoStream = null;
                }
                // Hide the video container and show selection again
                const videoContainer = document.getElementById('video-container');
                const poseSelection = document.getElementById('pose-selection');
                const arSession = document.getElementById('ar-session');
                const feedbackArea = document.getElementById('feedback-area');
                const referenceContainer = document.getElementById('reference-container');

                if (videoContainer) videoContainer.style.display = 'none';
                if (poseSelection) poseSelection.style.display = 'grid';
                if (arSession) arSession.style.display = 'block';
                if (feedbackArea) feedbackArea.style.display = 'none';
                if (referenceContainer) referenceContainer.style.display = 'none';

                this.currentPose = null;
                this.correctionHistory = [];
                console.log("AR assessment stopped.");
            },

                    </svg>
                `;
            },

            // --- Rendering Methods ---
            renderNav() {

                const topNav = document.getElementById('top-nav');

                        </button>
                    `;
                }).join('');
            },

            renderContent() {
                this.contentEl.innerHTML = '';
                const viewKey = this.currentView;
                let contentHTML = '';

                switch (viewKey) {
                    case 'dashboard':
                        contentHTML = this.renderDashboard();
                        break;
                    case 'asana':
                        contentHTML = this.renderAsanaLibrary();
                        break;
                    case 'ar_correction':
                        contentHTML = this.renderARCorrection();
                        break;
                    case 'course':
                        contentHTML = this.renderCourse();
                        break;
                    case 'assistant':
                        contentHTML = this.renderAssistant();
                        break;
                    default:
                        contentHTML = '<div class="text-center text-ink-500 py-20">404 · View Not Found</div>';
                }

                this.contentEl.innerHTML = `<div class="view-fade-in">${contentHTML}</div>`;
            },

            renderDashboard() {
                // Pull live data if available
                const userName = (typeof window !== 'undefined' && window.__user_name) ? window.__user_name : 'friend';
                const first = (userName || 'A').trim().split(/\s+/)[0];

                const hourOfDay = new Date().getHours();
                const tod = hourOfDay < 5 ? 'NIGHT' : hourOfDay < 12 ? 'MORNING' : hourOfDay < 17 ? 'AFTERNOON' : hourOfDay < 21 ? 'EVENING' : 'NIGHT';
                const dayName = new Date().toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
                const timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

                // Pick today's focus asana (first non-completed from course or default Tadasana)
                const todaysPose = (this.courseProgress?.poses || []).find(p => !p.completed && !p.locked);
                const todayName = todaysPose?.name || 'Tadasana';
                const todayAsana = asanaData.find(a => a.name === todayName) || asanaData[0];

                // KPIs
                const completedAsanas = this.userData?.completed_asanas || {};
                const totalSessions = Object.values(completedAsanas).reduce((a,b)=>a+(Number(b)||0),0);
                const activeDays = this.userData?.total_active_days || 0;

                // Continue list: last 3 poses from course progress, falling back to defaults
                const continueList = (this.courseProgress?.poses || []).slice(0, 3);

                return `
                <div class="space-y-8 md:space-y-12">

                    <!-- Hero -->
                    <section class="relative overflow-hidden rounded-[28px] md:rounded-[36px] bg-forest-900 text-cream p-6 md:p-12 lg:p-14">
                        <div style="position:absolute; width:640px; height:640px; border-radius:9999px; background:rgba(74,107,77,0.38); filter:blur(130px); top:-180px; right:-160px; pointer-events:none;"></div>
                        <div style="position:absolute; width:420px; height:420px; border-radius:9999px; background:rgba(184,87,62,0.28); filter:blur(110px); bottom:-180px; left:-120px; pointer-events:none;"></div>

                        <div class="relative grid md:grid-cols-[1.3fr_1fr] gap-6 md:gap-10 items-center">
                            <div class="space-y-5 md:space-y-6">
                                <p class="kicker text-[10px] md:text-[11px] text-saffron-500">${dayName} · ${tod} · ${timeStr}</p>
                                <h1 class="font-display font-light text-[44px] md:text-[72px] lg:text-[84px] leading-[1.02] tracking-tight">
                                    ${tod === 'MORNING' ? 'Good morning' : tod === 'AFTERNOON' ? 'Good afternoon' : tod === 'EVENING' ? 'Good evening' : 'Welcome back'},<br>${first}.
                                </h1>
                                <p class="text-[15px] md:text-[17px] text-forest-100/90 leading-[1.7] max-w-[560px]">
                                    ${activeDays > 0 ? `Your body has had <strong class="text-cream">${activeDays} day${activeDays===1?'':'s'}</strong> of practice. ` : 'Welcome to Sunday. '}Today, return to ${todayName} and move gently through your flow.
                                </p>
                                <div class="flex flex-wrap items-center gap-3 pt-2">
                                    <button onclick="app.navigate('ar_correction')" class="pressable inline-flex items-center gap-2 px-6 md:px-8 py-3.5 md:py-4 rounded-full bg-cream text-ink-900 font-semibold text-[14px] md:text-[15px] shadow-lg shadow-black/25 hover:bg-paper">
                                        Start today's practice <span class="opacity-70">→</span>
                                    </button>
                                    <button onclick="app.navigate('asana')" class="pressable inline-flex items-center gap-2 px-6 md:px-8 py-3.5 md:py-4 rounded-full border border-forest-300/60 text-forest-100 font-semibold text-[14px] md:text-[15px] hover:bg-forest-700/40">
                                        Just browse for now
                                    </button>
                                </div>
                            </div>
                            <div class="relative rounded-[24px] md:rounded-[28px] bg-forest-700 aspect-[4/3] md:aspect-auto md:h-[320px] flex flex-col items-center justify-center overflow-hidden">
                                <div style="position:absolute; inset:0; background: radial-gradient(circle at 50% 40%, rgba(212,160,74,0.25), transparent 60%);"></div>
                                <span class="relative text-[120px] md:text-[160px] leading-none font-display font-light text-forest-100">${todayAsana.emoji || '🧘'}</span>
                                <div class="absolute bottom-5 left-5 right-5">
                                    <p class="kicker text-[10px] text-saffron-500">TODAY'S FOCUS</p>
                                    <p class="font-display text-[22px] md:text-[24px] text-cream mt-1">${todayAsana.name}</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- KPIs -->
                    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5">
                        ${[
                            {k:'STREAK', v: activeDays, s:'active days'},
                            {k:'SESSIONS', v: totalSessions, s:'poses completed'},
                            {k:'LEARNING', v: Object.keys(completedAsanas).length, s:'poses in rotation'},
                            {k:'LEVEL', v: activeDays>=60?'III': activeDays>=14?'II':'I', s:'practitioner rank'},

                                <div>
                                    <p class="font-display text-[48px] md:text-[68px] leading-[0.95] font-light text-ink-900">${kpi.v}</p>
                                    <p class="text-[12px] md:text-[13px] text-ink-500 mt-1">${kpi.s}</p>
                                </div>
                            </div>
                        `).join('')}
                    </section>

                    <!-- Continue + Quote -->
                    <section class="grid md:grid-cols-[1.1fr_1fr] gap-5">
                        <div class="rounded-[22px] md:rounded-[28px] bg-paper p-5 md:p-8">

                                <button onclick="app.navigate('asana')" class="kicker text-[11px] text-ink-500 hover:text-ink-900 hidden md:inline-flex">ALL →</button>
                            </div>
                            <div class="space-y-3">
                                ${continueList.map(p => {
                                    const a = asanaData.find(x => x.name === p.name);
                                    const cat = (a?.category || 'Beginner').toUpperCase();
                                    const pct = Math.round(p.bestAccuracy || 0);
                                    return `
                                    <button onclick="app.showAsanaDetails('${p.name}')" class="pressable w-full text-left flex items-center gap-4 p-3 md:p-4 rounded-[16px] bg-cream hover:bg-sand transition-colors">
                                        <div class="w-12 h-12 md:w-14 md:h-14 rounded-[12px] bg-forest-900 text-saffron-500 flex items-center justify-center text-[22px] md:text-[26px] shrink-0">${a?.emoji || '🧘'}</div>
                                        <div class="flex-1 min-w-0">
                                            <p class="font-display text-[16px] md:text-[18px] text-ink-900 truncate">${p.name}</p>
                                            <p class="kicker text-[10px] text-ink-500 mt-0.5 truncate">${(a?.sanskrit || '').toUpperCase()} · ${cat}</p>
                                        </div>
                                        <div class="text-right shrink-0">
                                            <p class="font-semibold text-[14px] md:text-[15px] text-ink-900">${pct}%</p>
                                            <p class="kicker text-[9px] text-ink-300 mt-0.5">${p.completed ? 'DONE' : p.locked ? 'LOCKED' : 'IN PROGRESS'}</p>
                                        </div>
                                    </button>
                                `;}).join('')}
