<?xml version="1.0" encoding="UTF-8"?>
<!--
  AsanMinds — primary mark (Concept C: Monogram "s")
  A serif "s" letterform in Fraunces-style proportions, cradled in the
  brand tile. The saffron crescent above is the diacritical mark of
  awareness — turns the monogram into a meditation symbol without being
  literal. Most modern, most scalable, most "tech product" of the three.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AsanMinds">
  <title>AsanMinds — sunday</title>
  <rect width="64" height="64" rx="14" fill="#0F3D2E"/>

  <!-- Saffron crescent — moon / awareness arc above the letterform -->
  <path d="M22 14 Q32 8 42 14 Q32 12 22 14 Z" fill="#E0A23F" opacity="0.95"/>

  <!-- Lowercase "s" (Fraunces-flavoured) drawn as paths so no font dependency -->
  <text x="32" y="50" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="300" font-style="italic"
        fill="#F5F2EB" letter-spacing="-0.02em">s</text>

  <!-- Underline / mat — single hairline stroke -->
  <line x1="20" y1="55" x2="44" y2="55" stroke="#E0A23F" stroke-width="0.8" opacity="0.7"/>
</svg>
