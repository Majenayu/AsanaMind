<?xml version="1.0" encoding="UTF-8"?>
<!--
  AsanMinds — primary mark (Concept B: Geometric Lotus)
  A five-petal lotus seen from above, geometric and quiet. The center
  bindu in saffron carries the "awakened mind" idea. Cleanest at small
  sizes — favicon, monogram, app icon. Reads as yoga without saying it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AsanMinds">
  <title>AsanMinds — sunday</title>
  <rect width="64" height="64" rx="14" fill="#0F3D2E"/>
  <g transform="translate(32 33)">
    <!-- 5 petals — alternating cream + cream-soft for depth -->
    <g fill="#F5F2EB">
      <ellipse cx="0" cy="-13.5" rx="5" ry="13.5" transform="rotate(0)"/>
      <ellipse cx="0" cy="-13.5" rx="5" ry="13.5" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13.5" rx="5" ry="13.5" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13.5" rx="5" ry="13.5" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13.5" rx="5" ry="13.5" transform="rotate(288)"/>
    </g>
    <!-- 5 inner petals offset for layering, slightly translucent -->
    <g fill="#C7DBCE" opacity="0.55">
      <ellipse cx="0" cy="-8.5" rx="3.4" ry="9" transform="rotate(36)"/>
      <ellipse cx="0" cy="-8.5" rx="3.4" ry="9" transform="rotate(108)"/>
      <ellipse cx="0" cy="-8.5" rx="3.4" ry="9" transform="rotate(180)"/>
      <ellipse cx="0" cy="-8.5" rx="3.4" ry="9" transform="rotate(252)"/>
      <ellipse cx="0" cy="-8.5" rx="3.4" ry="9" transform="rotate(324)"/>
    </g>
    <!-- Bindu — the awakened center -->
    <circle cx="0" cy="0" r="3.4" fill="#E0A23F"/>
    <circle cx="0" cy="0" r="1.4" fill="#0F3D2E"/>
  </g>
</svg>
