<!-- CSRF — wrap fetch() so every state-changing same-origin call carries
     X-CSRF-Token. window.__csrf_token is injected by /admin via
     _inject_csrf_token in app.py. -->
<script>
(function(){
    if (window.__csrfFetchInstalled) return;
    window.__csrfFetchInstalled = true;
    var EXEMPT = {
        '/auth/google': 1, '/api/health/report': 1, '/login': 1,
        '/register': 1, '/api/live/upload': 1, '/api/live/stop': 1,
        '/api/assistant': 1
    };
    var origFetch = window.fetch.bind(window);
    async function ensureToken() {
        if (window.__csrf_token) return window.__csrf_token;
        try {
            var r = await origFetch('/api/csrf', { credentials: 'same-origin' });
            var j = await r.json();
            window.__csrf_token = j && j.token || '';
        } catch (_) {}
        return window.__csrf_token || '';
    }
    window.__getCsrfToken = ensureToken;
    window.fetch = async function(input, init) {
        init = init || {};
        var method = (init.method || (input && input.method) || 'GET').toUpperCase();
        var url = (typeof input === 'string') ? input : (input && input.url) || '';
        var path = url;
        try {
            if (/^https?:/i.test(url)) {
                var u = new URL(url, window.location.href);
                if (u.origin !== window.location.origin) return origFetch(input, init);
                path = u.pathname;
            } else if (url.indexOf('?') >= 0) {
                path = url.split('?')[0];
            }
        } catch (_) {}
        if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return origFetch(input, init);
        if (EXEMPT[path]) return origFetch(input, init);
        var headers = new Headers(init.headers || (input && input.headers) || {});
        if (!headers.has('X-CSRF-Token')) {
            var tok = await ensureToken();
            if (tok) headers.set('X-CSRF-Token', tok);
        }
        init.headers = headers;
        if (!init.credentials) init.credentials = 'same-origin';
        return origFetch(input, init);
    };
})();
</script>
<style>
:root {
    --bg:#F5F2EB; --surface:#FFFFFF; --surface-2:#EEE9DE; --surface-3:#E0D9C8; --border:#D4CCB8;
    --text-1:#14120E; --text-2:#4A453B; --text-3:#7A7364; --text-4:#A8A294;
    --primary:#0F3D2E; --primary-2:#1F5A44; --primary-3:#6FA089; --primary-4:#C7DBCE;
    --accent:#C2552F; --accent-soft:#F6DACB; --highlight:#E0A23F; --highlight-2:#F3D58C;
    --success:#3E8A52; --warn:#E0A23F; --danger:#C2552F;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-1);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
.kicker{font-family:Inter,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-3)}
.display{font-family:Fraunces,serif;letter-spacing:-0.02em;font-weight:300}
.mono{font-family:'JetBrains Mono',monospace}
.pressable{transition:transform .12s ease,background .2s ease,box-shadow .2s ease;cursor:pointer}
.pressable:active{transform:scale(0.98)}

.topbar{position:sticky;top:0;z-index:30;background:rgba(245,242,235,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,24,20,.06)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:30px;height:30px;border-radius:8px;display:block;flex-shrink:0}
.brand-dot{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-size:15px;font-weight:500}
.brand-word{font-family:Fraunces,serif;font-size:19px;font-weight:500;letter-spacing:-0.01em}
.brand-tag{background:var(--accent);color:var(--bg);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:4px}
.nav a{padding:8px 14px;border-radius:9999px;color:var(--text-3);font-size:13px;font-weight:500}
.nav a.active{background:rgba(15,61,46,.08);color:var(--text-1)}
.nav a:hover{background:rgba(15,61,46,.04);color:var(--text-1)}
.nav-right{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:9999px;background:var(--primary);color:var(--bg);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;font-family:Fraunces,serif;font-size:13px;font-weight:500}

.page{max-width:1400px;margin:0 auto;padding:32px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-head h1{font-family:Fraunces,serif;font-size:42px;font-weight:300;letter-spacing:-0.02em;margin:6px 0 0}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:32px}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}
.kpi-label{color:var(--text-3);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase}
.kpi-n{font-family:Fraunces,serif;font-size:38px;font-weight:300;line-height:1.1;letter-spacing:-0.02em;margin-top:6px;color:var(--text-1)}
.kpi-sub{color:var(--text-3);font-size:12px;margin-top:6px}

.section{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head h2{font-family:Fraunces,serif;font-size:22px;font-weight:400;margin:0}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.input{height:38px;padding:0 14px;border-radius:9999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-1);font-size:13px;font-family:inherit;outline:none;min-width:200px}
.input:focus{border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:9999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-2)}
.btn-accent{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-accent:hover{filter:brightness(1.05)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:var(--bg)}
.btn-sm{height:30px;padding:0 12px;font-size:12px}

.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--surface-2);font-size:13px;vertical-align:middle}
.table th{color:var(--text-3);font-weight:500;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;background:var(--surface-2);position:sticky;top:64px;cursor:pointer}
.table th.sortable:hover{background:var(--surface-3)}
.table tr.row{cursor:pointer}
.table tr.row:hover{background:var(--surface-2)}
.cell-name{display:flex;align-items:center;gap:10px}
.cell-name .av{width:32px;height:32px;border-radius:9999px;background:var(--primary);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-size:13px;background-size:cover;background-position:center;flex-shrink:0}
.cell-name .meta{display:flex;flex-direction:column}
.cell-name .meta .n{color:var(--text-1);font-weight:500}
.cell-name .meta .e{color:var(--text-3);font-size:11px}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:500;letter-spacing:0.06em}
.badge-google{background:#E8F0FE;color:#1A73E8}
.badge-email{background:var(--surface-3);color:var(--text-2)}
.badge-master{background:var(--accent);color:var(--bg)}
.badge-progress{background:var(--primary);color:var(--bg)}
.badge-locked{background:var(--surface-3);color:var(--text-3)}
.badge-active{background:#D4F5DC;color:var(--success)}

.chart-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:1024px){.chart-grid{grid-template-columns:1fr 1fr}}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.chart-card h3{font-family:Fraunces,serif;font-size:18px;font-weight:400;margin:0 0 6px}
.chart-card .sub{color:var(--text-3);font-size:12px;margin-bottom:14px}
.chart-host{position:relative;height:280px}

.empty{padding:32px;text-align:center;color:var(--text-3);font-size:14px}
.spinner{width:24px;height:24px;border:3px solid rgba(15,61,46,.15);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;margin:32px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.deep-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:1024px){.deep-grid{grid-template-columns:1fr 1fr}}

.profile-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.profile-hero .av{width:96px;height:96px;border-radius:9999px;background:var(--primary);color:var(--bg);font-family:Fraunces,serif;font-size:42px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.profile-hero h1{margin:0;font-family:Fraunces,serif;font-size:36px;font-weight:300;letter-spacing:-0.02em}
.profile-hero .meta{color:var(--text-3);font-size:14px;margin-top:4px}
.profile-hero .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13px}
.kv .k{color:var(--text-3);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;align-self:center}
.kv .v{color:var(--text-1)}

.sem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.sem{padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);font-size:13px}
.sem.done{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.sem.locked{opacity:.5}
.sem .t{font-family:Fraunces,serif;font-size:18px;font-weight:300;letter-spacing:-0.01em;line-height:1.2}
.sem .s{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:4px}
.sem .mark{font-family:Fraunces,serif;font-size:24px;font-weight:300;line-height:1;margin-top:6px}

.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar-row .label{flex:1;font-size:13px;color:var(--text-2)}
.bar-row .track{flex:2;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--primary);border-radius:3px}
.bar-row .pct{width:40px;text-align:right;font-size:12px;color:var(--text-3);font-family:'JetBrains Mono',monospace}

.feedback-card{padding:16px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--surface-2)}
.feedback-card .stars{color:var(--highlight);font-size:14px;letter-spacing:1px}
.feedback-card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.feedback-card .body{font-size:13px;color:var(--text-2);line-height:1.55}
.feedback-card .body p{margin:6px 0}
.feedback-card .body strong{color:var(--text-1);font-weight:500}

.modal-bg{position:fixed;inset:0;background:rgba(20,18,14,.7);backdrop-filter:blur(8px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.active{display:flex}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.modal-h{padding:22px 24px 12px;border-bottom:1px solid var(--surface-2)}
.modal-h h3{font-family:Fraunces,serif;font-size:22px;font-weight:400;margin:0}
.modal-b{padding:18px 24px}
.modal-b textarea{width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-family:inherit;font-size:13px;color:var(--text-1);resize:vertical}
.modal-b label{display:block;font-size:12px;color:var(--text-3);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:6px;margin-top:14px}

.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:9999px;padding:4px;margin-bottom:18px;overflow-x:auto}
.tabs span{padding:8px 16px;border-radius:9999px;font-size:12px;font-weight:500;color:var(--text-3);cursor:pointer;white-space:nowrap}
.tabs span.active{background:var(--primary);color:var(--bg)}

/* Live indicator dot — shows beside each student. Off = grey, on = green pulse. */
.live-dot{display:inline-block;width:12px;height:12px;border-radius:9999px;background:#A8A294;cursor:default}
.live-cell{cursor:default}
.live-cell.on{cursor:pointer}
.live-cell.on .live-dot{background:#3E8A52;animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(62,138,82,0.55)}
  70%{box-shadow:0 0 0 8px rgba(62,138,82,0)}
  100%{box-shadow:0 0 0 0 rgba(62,138,82,0)}
}

/* Live viewer modal */
.live-viewer-shell{background:#0a100b;border-radius:22px;width:100%;max-width:720px;border:1px solid #1F5A44;color:#F5F2EB;overflow:hidden}
.live-viewer-shell .head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:#15201A;border-bottom:1px solid #1F5A44}
.live-viewer-shell .head h3{font-family:Fraunces,serif;font-weight:400;font-size:18px;margin:0;color:#F5F2EB}
.live-viewer-shell .meta{font-size:11px;color:#6FA089;letter-spacing:0.18em;text-transform:uppercase}
.live-viewer-shell img{display:block;width:100%;background:#000}
.live-viewer-shell .stats{padding:14px 18px;display:flex;gap:14px;font-size:12px;color:#C7DBCE;flex-wrap:wrap}
.live-viewer-shell .pill{background:#1F5A44;padding:4px 10px;border-radius:9999px;font-weight:500;color:#F5F2EB}

/* ─── Mobile drawer + responsive overrides ─────────────────────── */
.menu-toggle{display:none;width:38px;height:38px;border:1px solid var(--border);background:var(--surface-2);border-radius:9999px;cursor:pointer;align-items:center;justify-content:center;color:var(--text-1);padding:0}
.menu-toggle svg{width:18px;height:18px}
.menu-backdrop{display:none;position:fixed;inset:0;background:rgba(20,18,14,.45);backdrop-filter:blur(4px);z-index:35}
.menu-backdrop.open{display:block}
.brand-tag{flex-shrink:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}

@media(max-width:880px){
  .topbar-inner{padding:0 16px;height:60px;gap:10px}
  .brand-word{font-size:17px}
  .menu-toggle{display:inline-flex}
  .nav{position:fixed;top:60px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px;gap:2px;transform:translateY(-130%);transition:transform .28s cubic-bezier(.22,.8,.3,1);z-index:40;box-shadow:0 16px 40px rgba(20,18,14,.12)}
  .nav.open{transform:translateY(0)}
  .nav a{padding:14px 16px;border-radius:12px;font-size:15px}
  .nav a.active{background:var(--primary);color:var(--bg)}
  .nav-right .btn{padding:0 12px;font-size:12px}
  .nav-right .btn[href="/home"]{display:none}

  .page{padding:20px 16px 80px}
  .page-head{margin-bottom:20px}
  .page-head h1{font-size:28px}
  .page-head .btn{height:36px;font-size:12px}

  .kpi{padding:16px}
  .kpi-n{font-size:28px}
  .section{padding:16px;border-radius:14px}
  .section-head h2{font-size:18px}
  .toolbar{gap:6px}
  .toolbar .input,.toolbar .btn,.toolbar .select{height:36px;font-size:12px;padding:0 12px;min-width:0;flex:1 1 auto}

  .table th,.table td{padding:10px 10px;font-size:12px}
  .table th{font-size:9px;top:60px}
  .cell-name .av{width:28px;height:28px;font-size:11px}
  .cell-name .meta .e{display:none}

  .profile-hero h1{font-size:26px}
  .profile-hero .av{width:64px;height:64px;font-size:28px}
  .profile-hero .actions{margin-left:0;width:100%}

  .kv{grid-template-columns:1fr}
  .kv .k{margin-top:10px}

  .modal{border-radius:18px;max-height:94vh}
  .modal-h{padding:18px 18px 10px}
  .modal-b{padding:14px 18px}

  .tabs{margin-bottom:14px}
  .tabs span{padding:7px 12px;font-size:11px}
}

@media(max-width:480px){
  .page-head h1{font-size:24px}
  .page{padding:16px 12px 80px}
  .topbar-inner{padding:0 12px}
  .brand-tag{display:none}
  .table th:nth-child(n+5),.table td:nth-child(n+5){display:none}
}
</style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/admin">
            <img class="brand-mark" src="/assets/brand/logo1.png" alt="AsanMinds" width="30" height="30">
            <span class="brand-word">sunday</span>
            <span class="brand-tag">Admin</span>
        </a>
        <button class="menu-toggle pressable" id="menu-toggle" aria-label="Open menu" aria-expanded="false" onclick="toggleMobileNav()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <nav class="nav" id="top-nav"></nav>
        <div class="nav-right">
            <a href="/home" class="btn btn-sm" title="Back to app">← App</a>
            <a href="/admin/logout" class="btn btn-sm">Sign out</a>
            <span class="avatar" id="admin-av"></span>
        </div>
    </div>
</header>
<div class="menu-backdrop" id="menu-backdrop" onclick="toggleMobileNav(false)"></div>

<main id="content" class="page">
    <div class="spinner"></div>
</main>

<div id="modal-bg" class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

<script>
// ─────────────────────────────────────────────────
// Mobile nav drawer
// ─────────────────────────────────────────────────
function toggleMobileNav(force){
    const nav = document.getElementById('top-nav');
    const back = document.getElementById('menu-backdrop');
    const tog = document.getElementById('menu-toggle');
    const want = (typeof force === 'boolean') ? force : !nav.classList.contains('open');
    nav.classList.toggle('open', want);
    back.classList.toggle('open', want);
    if (tog) tog.setAttribute('aria-expanded', want ? 'true' : 'false');
}

// ─────────────────────────────────────────────────
// Admin SPA — single-file router, fetches from /api/admin/*
// ─────────────────────────────────────────────────
const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => Array.from((p || document).querySelectorAll(s));
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) : '—';
const initials = (n) => (n || 'A').trim().charAt(0).toUpperCase();

// HTML-escape any runtime value before interpolating into innerHTML / template
// strings. Defense in depth — a malicious org name, student name, or feedback
// comment cannot inject markup. Use this for every dynamic value that's
// inserted into innerHTML or a template literal building HTML.
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// F4 of audit pass — stricter URL escape for CSS url() / href / src
// contexts. Reject anything that isn't a plain http(s) URL.
function escUrl(u) {
    const s = String(u == null ? '' : u).trim();
    if (!s) return '';
    if (s.length > 500) return '';
    if (!/^https?:\/\/[a-zA-Z0-9._\-]+(:[0-9]+)?(\/[^\s"'<>`\\]*)?$/.test(s)) return '';
    return s;
}

const ROUTES = [
    { path: 'dashboard', label: 'Dashboard' },
    { path: 'organizations', label: 'Organizations' },
    { path: 'students', label: 'Students' },
    { path: 'feedback', label: 'Feedback' },
    { path: 'certificates', label: 'Certificates' },
    { path: 'analytics', label: 'Analytics' },
    { path: 'health', label: 'Health' },
];

let adminProfile = null;

function renderNav(active) {
    const nav = $('#top-nav');
    nav.innerHTML = ROUTES.map(r =>
        `<a href="#${r.path}" class="${active === r.path ? 'active' : ''}">${r.label}</a>`
    ).join('');

    nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => toggleMobileNav(false)));
}

async function fetchJSON(url) {
    const r = await fetch(url, { credentials: 'same-origin' });
    if (!r.ok) throw new Error(`${url} → ${r.status}`);
    return r.json();
}

function renderRoute() {

}

function drawChart(canvasId, type, payload) {
    if (!payload) return;
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    new Chart(ctx, {
        type,
        data: {
            labels: payload.labels,
            datasets: [{
                label: payload.label,
                data: payload.values,
                backgroundColor: type === 'bar' ? '#0F3D2E' : 'rgba(15,61,46,.12)',
                borderColor: '#0F3D2E',
                borderWidth: 2,
                tension: 0.35,
                fill: type === 'line',
            }],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { color: '#7A7364', font: { size: 11 } }, grid: { color: 'rgba(0,0,0,.05)' } },
                x: { ticks: { color: '#7A7364', font: { size: 11 } }, grid: { display: false } },
            },
        },
    });
}

                </select>

                    <option value="30">Active in 30 days</option>
                    <option value="never">Never active</option>
                </select>
            </div>
            <div id="student-table"><div class="spinner"></div></div>
        </div>
    `;
    try {

function filterStudents() {
    const q = ($('#search')?.value || '').toLowerCase();
    const prov = $('#filter-provider')?.value || '';
    const act = $('#filter-active')?.value || '';
    const today = new Date().toISOString().slice(0,10);
    const cutoff = (days) => {
        const d = new Date(); d.setDate(d.getDate() - days);
        return d.toISOString().slice(0,10);
    };
    const filtered = studentCache.filter(s => {
        if (q && !((s.name || '').toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q))) return false;
        if (prov && s.auth_provider !== prov) return false;
        if (act === '7' && (!s.last_active || s.last_active < cutoff(7))) return false;
        if (act === '30' && (!s.last_active || s.last_active < cutoff(30))) return false;
        if (act === 'never' && s.last_active) return false;
        return true;
    });
    $('#student-table').innerHTML = renderStudentsTable(filtered);
}

        const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '—';
        const npsBuckets = { yes:0, maybe:0, no:0 };
        fb.forEach(x => { if (x.nps && npsBuckets[x.nps] !== undefined) npsBuckets[x.nps]++; });
        const promoters = npsBuckets.yes;
        const detractors = npsBuckets.no;
        const totalNps = promoters + npsBuckets.maybe + detractors;
        const npsScore = totalNps ? Math.round(((promoters - detractors) / totalNps) * 100) : 0;
        $('#fb-summary').innerHTML = `
            <div class="kpis" style="margin:0">
                <div class="kpi"><span class="kpi-label">Avg rating</span><div class="kpi-n">${avg}<span style="font-size:18px;color:#E0A23F">★</span></div><div class="kpi-sub">${ratings.length} ratings</div></div>
                <div class="kpi"><span class="kpi-label">NPS</span><div class="kpi-n">${npsScore}</div><div class="kpi-sub">${promoters} yes / ${npsBuckets.maybe} maybe / ${detractors} no</div></div>
                <div class="kpi"><span class="kpi-label">Submissions</span><div class="kpi-n">${fb.length}</div><div class="kpi-sub">total</div></div>
                <div class="kpi"><span class="kpi-label">Last 7 days</span><div class="kpi-n">${fb.filter(x => x.submitted_at > new Date(Date.now()-7*86400000).toISOString()).length}</div></div>
            </div>
        `;
        filterFeedback();
    } catch (e) {
        $('#fb-list').innerHTML = '<div class="empty">Failed to load.</div>';
    }
}

function filterFeedback() {
    const v = $('#fb-filter')?.value || '';
    let rows = window.__feedback || [];
    if (v === '5') rows = rows.filter(r => r.rating === 5);
    else if (v === '4') rows = rows.filter(r => r.rating >= 4);
    else if (v === 'low') rows = rows.filter(r => r.rating && r.rating <= 3);
    if (!rows.length) { $('#fb-list').innerHTML = '<div class="empty">No feedback yet.</div>'; return; }
    const stars = (n) => '★'.repeat(n||0) + '☆'.repeat(5-(n||0));
    $('#fb-list').innerHTML = rows.map(f => `
        <div class="feedback-card">
            <div class="head">
                <div class="cell-name">
                    <div class="av" ${escUrl(f.picture) ? `style="background-image:url(&quot;${escUrl(f.picture)}&quot;)"` : ''}>${escUrl(f.picture) ? '' : esc(initials(f.name))}</div>

                <span class="stars">${stars(f.rating)}</span>

            <div class="body">
                ${f.helpful ? `<p><strong>Most helpful:</strong> ${esc(f.helpful)}</p>` : ''}

                ${f.nps ? `<p><strong>Recommend:</strong> ${esc(f.nps)}</p>` : ''}
            </div>
        </div>
    `).join('');
}

async function renderOrganizations() {
    $('#content').innerHTML = `
        <div class="page-head">
            <div><span class="kicker">Organizations</span><h1>Tenant management</h1></div>
            <button class="btn btn-accent" onclick="openCreateOrgModal()">+ New organization</button>
        </div>

            <div class="toolbar">
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)">
                    <input type="checkbox" id="show-system" onchange="renderOrganizations()"> Show system orgs (test users)
                </label>
            </div>
            <div id="org-list"><div class="spinner"></div></div>
        </div>
    `;
    const showSystem = $('#show-system')?.checked ? '?system=1' : '';
    try {
        const data = await fetchJSON('/api/admin/organizations' + showSystem);
        const rows = data.organizations || [];
        if (!rows.length) {
            $('#org-list').innerHTML = '<div class="empty">No organizations yet. Click "New organization" to add one.</div>';
            return;
        }
        // Stash full org rows by email so action buttons can look them up by
        // attribute instead of via fragile JSON-in-onclick injection.
        window.__orgRowsByEmail = {};
        rows.forEach(o => { window.__orgRowsByEmail[o.email] = o; });

        const esc = (s) => String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

        $('#org-list').innerHTML = `
            <div style="overflow-x:auto"><table class="table">
                <thead><tr><th>Organization</th><th>Domain</th><th>Seats</th><th>Status</th><th>Created</th><th></th></tr></thead>
                <tbody>
                ${rows.map(o => `
                    <tr class="row">
                        <td><strong>${esc(o.name)}</strong><br><span style="color:var(--text-3);font-size:11px">${esc(o.email)}</span></td>
                        <td>${o.domain === '*' ? '<span class="badge" style="background:var(--surface-3);color:var(--text-2)">any</span>' : '@' + esc(o.domain)}</td>
                        <td>${o.studentsEnrolled || 0} / ${o.studentCap || '∞'}</td>
                        <td>${o.system ? '<span class="badge" style="background:#FEF3C7;color:#A16207">System</span>' : (o.paid ? '<span class="badge" style="background:#D4F5DC;color:#3E8A52">Paid</span>' : '<span class="badge" style="background:var(--surface-3);color:var(--text-2)">Trial</span>')}</td>
                        <td>${fmtDate(o.createdAt)}</td>
                        <td style="white-space:nowrap">
                            <button class="btn btn-sm" data-org-action="invite" data-org-email="${esc(o.email)}">📧 Invite admin</button>
                            <button class="btn btn-sm" data-org-action="edit" data-org-email="${esc(o.email)}">✎</button>
                            ${o.system ? '' : `<button class="btn btn-sm btn-danger" data-org-action="delete" data-org-email="${esc(o.email)}">🗑</button>`}
                        </td>
                    </tr>
                `).join('')}
                </tbody>
            </table></div>
        `;
        // Single delegated click handler — survives names/emails with quotes,
        // apostrophes, ampersands, etc. without any string escaping headaches.
        $('#org-list').addEventListener('click', (ev) => {
            const btn = ev.target.closest('[data-org-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-org-action');
            const email = btn.getAttribute('data-org-email');
            const o = (window.__orgRowsByEmail || {})[email];
            if (!o) return;
            if (action === 'invite') openInviteOrgAdmin(o.email, o.name);
            else if (action === 'edit') openEditOrgModal(o);
            else if (action === 'delete') confirmDeleteOrg(o.email);
        });
    } catch (e) { $('#org-list').innerHTML = '<div class="empty">Failed to load.</div>'; }
}

async function saveCreateOrg() {
    const payload = {
        name: $('#org-name').value.trim(),
        email: $('#org-email').value.trim().toLowerCase(),
        domain: $('#org-domain').value.trim().toLowerCase(),
        studentCap: parseInt($('#org-cap').value, 10),
        paid: $('#org-paid').checked,
    };
    if (!payload.name || !payload.email || !payload.domain || !payload.studentCap) {
        alert('All fields are required.'); return;
    }
    try {
        const r = await fetch('/api/admin/organization', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const j = await r.json();
        if (!j.success) { alert(j.error || 'Failed'); return; }
        // Surface the auto-invite outcome — the org-admin gets a magic link
        // emailed automatically, but if SMTP failed we hand the link back so
        // super-admin can deliver it themselves.
        if (j.emailSent) {
            alert('✓ Organization created.\n\nAn invitation email with a Google sign-in magic link has been sent to ' + payload.email + '.');
        } else if (j.inviteLink) {
            prompt('Organization created, but the invitation email could not be sent automatically.\n\nCopy this magic link and send it to the org admin:', j.inviteLink);
        } else {
            alert('Organization created. You can invite the admin from the actions column.');
        }
        closeModal(); renderOrganizations();
    } catch(e) { alert(e.message); }
}

async function saveEditOrg(email) {

    const r = await fetch('/api/admin/broadcast', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body }),
    });
    const j = await r.json();
    closeModal();
    alert(j.success ? `Sent to ${j.delivered} of ${j.attempted} subscribers.` : (j.error || 'Failed.'));
}

function openNotifyModal(email) {
    showModal(`
        <div class="modal-h"><h3>Send a push to ${esc(email)}</h3></div>
        <div class="modal-b">
            <label>Title</label>
            <input class="input" id="nf-title" style="width:100%" value="A note from your coach" />
            <label>Message</label>
            <textarea id="nf-body">Keep going — your form is improving.</textarea>
            <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-accent" onclick="sendNotify('${String(email).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">Send</button>
            </div>
        </div>
    `);
}
async function sendNotify(email) {
    const title = $('#nf-title').value.trim();
    const body = $('#nf-body').value.trim();
    if (!title || !body) return;
    const r = await fetch('/api/admin/notify/' + encodeURIComponent(email), {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body }),
    });
    const j = await r.json();
    closeModal();
    alert(j.success ? 'Push sent.' : (j.error || 'Failed.'));
}

async function confirmReset(email) {
    if (!confirm(`Reset all course progress for ${email}? Their certificates and account will remain.`)) return;
    const r = await fetch('/api/admin/reset/' + encodeURIComponent(email), { method: 'POST', credentials: 'same-origin' });
    const j = await r.json();
    alert(j.success ? 'Progress reset.' : (j.error || 'Failed.'));
    if (j.success) renderStudentDeep(email);
}

async function confirmDelete(email) {
    const typed = prompt(
        `⚠ Permanently delete ${email}?\n\n` +
        'This will erase the user document, course progress, certificates, ' +
        'preferences, push subscriptions, streak freezes, and all feedback. ' +
        'It cannot be undone.\n\n' +
        'Type DELETE (uppercase) to confirm.'
    );
    if (typed !== 'DELETE') {
        if (typed !== null) alert('Cancelled — you didn\'t type DELETE.');
        return;
    }
    try {
        const r = await fetch('/api/admin/delete/' + encodeURIComponent(email), { method: 'POST', credentials: 'same-origin' });
        const j = await r.json();
        if (j.success) {
            const counts = j.deleted || {};
            const total = Object.values(counts).reduce((s, n) => s + (n || 0), 0);
            alert(`Done. Removed ${total} record(s) across ${Object.keys(counts).length} collections.\n\n` +
                  Object.entries(counts).filter(([,n]) => n > 0).map(([k,n]) => `• ${k}: ${n}`).join('\n'));
            location.hash = '#students';
        } else {
            alert(j.error || 'Failed.');
        }
    } catch (e) { alert('Network error.'); }
}

// ─────────────────────────────────────────────────
// LIVE STUDENT FEED — hidden coach view
// ─────────────────────────────────────────────────
let _livePollTimer = null;
let _liveStatusCache = {};

async function refreshLiveStatus() {
    try {
        const r = await fetchJSON('/api/admin/live/status');
        _liveStatusCache = r.live || {};
        // Update every visible live-cell.
        $$('.live-cell').forEach(td => {
            const em = (td.dataset.email || '').toLowerCase();
            const live = _liveStatusCache[em];
            if (live) {
                td.classList.add('on');
                td.title = `LIVE · ${live.pose || 'no pose'} · ${live.score}% · double-click to view`;
            } else {
                td.classList.remove('on');
                td.title = 'Not in a live session';
            }
        });
    } catch (_) {}
}

function startLivePolling() {
    if (_livePollTimer) return;
    refreshLiveStatus();
    _livePollTimer = setInterval(refreshLiveStatus, 3000);
}

function stopLivePolling() {
    if (_livePollTimer) { clearInterval(_livePollTimer); _livePollTimer = null; }
}

let _liveViewerTimer = null;
let _liveViewerEmail = null;

function openLiveViewer(email) {
    // First check if the student is actually live — no point asking for the
    // password otherwise.
    const status = _liveStatusCache[email.toLowerCase()];
    if (!status) {
        alert('That student is not in a live session right now.');
        return;
    }
    // Password modal — password is verified server-side and stored only
    // in an httpOnly cookie scoped to /api/admin/live/. Never exposed to
    // any other JS or stored in localStorage.
    showModal(`
        <div class="modal-h"><h3>Restricted view</h3></div>
        <div class="modal-b">
            <p style="color:#7A7364;font-size:13px;margin:0 0 14px">Enter the live-view password to watch this student's session.</p>
            <input class="input" id="live-pw" type="password" style="width:100%" placeholder="••••••" autofocus>
            <p id="live-err" style="color:#C2552F;font-size:12px;margin:10px 0 0;display:none"></p>
            <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-accent" onclick="submitLivePass('${email.replace(/'/g,"\\'")}')">Watch</button>
            </div>
        </div>
    `);
    setTimeout(() => $('#live-pw')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') submitLivePass(email);
    }), 50);
}

async function submitLivePass(email) {
    const pw = $('#live-pw').value;
    if (!pw) return;
    try {
        const r = await fetch('/api/admin/live/check', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
        });
        if (!r.ok) {
            const j = await r.json().catch(() => ({}));
            $('#live-err').style.display = 'block';
            $('#live-err').textContent = j.error || 'Wrong password.';
            return;
        }
        startLiveViewer(email);
    } catch (e) {
        $('#live-err').style.display = 'block';
        $('#live-err').textContent = 'Network error.';
    }
}

function startLiveViewer(email) {
    _liveViewerEmail = email;
    showModal(`
        <div class="live-viewer-shell">
            <div class="head">
                <div>
                    <span class="meta">Live coach view</span>
                    <h3 id="lv-name">${email}</h3>
                </div>
                <button class="btn btn-sm" style="background:#1F5A44;color:#F5F2EB;border-color:#1F5A44" onclick="stopLiveViewer()">Close</button>
            </div>
            <div style="position:relative">
                <img id="lv-img" alt="Live frame" style="min-height:240px;background:#000">
                <div id="lv-overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6FA089;font-size:13px">Connecting…</div>
            </div>
            <div class="stats">
                <span class="pill"><span style="display:inline-block;width:8px;height:8px;border-radius:9999px;background:#3E8A52;margin-right:6px;animation:livePulse 1.6s ease-in-out infinite"></span><span id="lv-pose">—</span></span>
                <span class="pill" id="lv-score">—%</span>
                <span class="pill" id="lv-age">just now</span>
            </div>
        </div>
    `);
    // Override modal default styles so the dark viewer fits.
    const modalEl = $('#modal');
    if (modalEl) { modalEl.style.maxWidth = '760px'; modalEl.style.background = 'transparent'; modalEl.style.border = 'none'; }

    if (_liveViewerTimer) clearInterval(_liveViewerTimer);
    const tick = async () => {
        if (!_liveViewerEmail) return;
        const cacheBuster = Date.now();
        const url = `/api/admin/live/frame/${encodeURIComponent(_liveViewerEmail)}?t=${cacheBuster}`;
        try {
            const r = await fetch(url, { credentials: 'same-origin' });
            if (!r.ok) {
                $('#lv-overlay') && ($('#lv-overlay').textContent = 'Student is not active right now.');
                return;
            }
            const blob = await r.blob();
            const objUrl = URL.createObjectURL(blob);
            const img = $('#lv-img');
            if (img) {
                img.src = objUrl;
                if ($('#lv-overlay')) $('#lv-overlay').style.display = 'none';
            }
            // Update meta from cached status (refreshed by main poll).
            const st = _liveStatusCache[_liveViewerEmail.toLowerCase()];
            if (st) {
                $('#lv-pose') && ($('#lv-pose').textContent = st.pose || '—');
                $('#lv-score') && ($('#lv-score').textContent = (st.score || 0) + '%');
                $('#lv-age') && ($('#lv-age').textContent = `${st.age}s ago`);
            }
        } catch (e) {
            $('#lv-overlay') && ($('#lv-overlay').textContent = 'Connection lost.');
        }
    };
    tick();
    _liveViewerTimer = setInterval(tick, 1500);
}

function stopLiveViewer() {
    if (_liveViewerTimer) { clearInterval(_liveViewerTimer); _liveViewerTimer = null; }
    _liveViewerEmail = null;
    closeModal();
    // Restore default modal styles for next opener.
    const modalEl = $('#modal');
    if (modalEl) { modalEl.style.maxWidth = ''; modalEl.style.background = ''; modalEl.style.border = ''; }
}

// Boot
(async function() {
    await bootProfile();
    renderRoute();
    startLivePolling();
})();
</script>
